    const absentCount = weekItems.filter(i => !isCancelled(i) && i.attendance === "ABSENT").length;
    const cancelledCount = weekItems.filter(i => isCancelled(i)).length;

    const subParts = [];
    if (presentCount) subParts.push(`<span class="mini p">${presentCount} present</span>`);
    if (absentCount) subParts.push(`<span class="mini a">${absentCount} absent</span>`);
    if (cancelledCount) subParts.push(`<span class="mini c">${cancelledCount} cancelled</span>`);
    if (!subParts.length) subParts.push(weekItems.length + " class" + (weekItems.length !== 1 ? "es" : ""));

    const head = document.createElement("div");
    head.className = "week-head";
    head.innerHTML = `
      <div class="week-num">${week}</div>
      <div class="week-meta">
        <div class="week-title">Week ${week}</div>
        <div class="week-sub">${subParts.join("")}</div>
      </div>
      <div class="week-chev">⌄</div>
    `;
    head.addEventListener("click", () => wb.classList.toggle("closed"));
    wb.appendChild(head);

    const body = document.createElement("div");
    body.className = "week-body";
    const inner = document.createElement("div");

    const grid = document.createElement("div");
    grid.className = "class-grid";

    weekItems.forEach((item, idx) => {
      const cancelled = isCancelled(item);
      const card = document.createElement("div");
      card.className = "card" + (cancelled ? " cancelled-card" : "");
      card.style.setProperty("--tone", subjectColor(item.subject));
      card.style.animationDelay = (idx * 0.05) + "s";

      card.addEventListener("mousemove", (e) => {
        const rect = card.getBoundingClientRect();
        card.style.setProperty("--cx", ((e.clientX - rect.left) / rect.width * 100) + "%");
        card.style.setProperty("--cy", ((e.clientY - rect.top) / rect.height * 100) + "%");
      });

      let actionsHTML = '';
      if (currentMode === "edit") {
        if (cancelled) {
          actionsHTML = `
            <div class="card-actions">
              <button class="act uncancel wide" data-a="uncancel" data-id="${item.id}">Mark as class</button>
              <button class="act del wide" data-a="delete" data-id="${item.id}">Delete</button>
            </div>
          `;
        } else {
          actionsHTML = `
            <div class="card-actions">
              <button class="act present" data-a="present" data-id="${item.id}">Present</button>
              <button class="act absent" data-a="absent" data-id="${item.id}">Absent</button>
              <button class="act cancel wide" data-a="cancel" data-id="${item.id}">Mark as cancelled</button>
              <button class="act del wide" data-a="delete" data-id="${item.id}">Delete</button>
            </div>
          `;
        }
      }

      card.innerHTML = `
        <div class="card-head">
          <div>
            <div class="card-date">${formatDate(item.date)}</div>
            <div class="card-day">${item.day}</div>
          </div>
        </div>
        <div class="card-subj">
          <span class="dot"></span>
          ${escapeHTML(item.subject)}
        </div>
        <div class="card-status">
          ${chipHTML(item)}
        </div>
        ${actionsHTML}
      `;

      if (currentMode === "edit") {
        card.querySelectorAll(".act").forEach(btn => {
          btn.addEventListener("click", e => {
            e.stopPropagation();
            const a = btn.getAttribute("data-a");
            const id = btn.getAttribute("data-id");
            if (a === "present") markAttendance(id, "PRESENT", btn);
            else if (a === "absent") markAttendance(id, "ABSENT", btn);
            else if (a === "cancel" || a === "uncancel") toggleCancelled(id, btn);
            else if (a === "delete") deleteClass(id);
          });
        });
        attachSwipe(card, item);
      }

      grid.appendChild(card);
    });

    inner.appendChild(grid);
    body.appendChild(inner);
    wb.appendChild(body);
    container.appendChild(wb);
  });
}

/* ==================================================================
   ESCAPE
================================================================== */
function escapeHTML(v) {
  return String(v)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

/* ==================================================================
   SUBJECT PICKER
================================================================== */
function getSavedSubjects() {
  return [...new Set(classes.map(i => String(i.subject || "").trim()).filter(Boolean))]
    .sort((a, b) => a.localeCompare(b));
}

function renderSuggest(filter = "") {
  const box = document.getElementById("subjectSuggestions");
  if (!box) return;
  const q = filter.trim().toLowerCase();
  const subs = getSavedSubjects().filter(n => !q || n.toLowerCase().includes(q));

  if (!subs.length) {
    box.innerHTML = q
      ? '<div class="log-empty" style="padding:14px">No saved subject found</div>'
      : '<div class="log-empty" style="padding:14px">No saved subjects yet</div>';
    return;
  }

  box.innerHTML = subs.map(name => `
    <button type="button" class="suggest-item" data-s="${escapeHTML(name)}">
      <span class="emoji">${getEmoji(name)}</span>
      <span class="name">${escapeHTML(name)}</span>
      <span class="edit" data-e="${escapeHTML(name)}" title="Change emoji">✎</span>
    </button>
  `).join("");

  box.querySelectorAll(".suggest-item").forEach(b => {
    const pick = e => {
      e.preventDefault();
      document.getElementById("subject").value = b.getAttribute("data-s");
      closeSuggest();
    };
    b.addEventListener("mousedown", pick);
    b.addEventListener("touchstart", pick, { passive: false });
  });

  box.querySelectorAll(".edit").forEach(ed => {
    const open = e => {
      e.preventDefault();
      e.stopPropagation();
      openEmojiPicker(ed.getAttribute("data-e"));
    };
    ed.addEventListener("mousedown", open);
    ed.addEventListener("touchstart", open, { passive: false });
  });
}

function openEmojiPicker(subject) {
  const box = document.getElementById("subjectSuggestions");
  if (!box) return;
  box.innerHTML = `
    <div class="emoji-title">Emoji for "${escapeHTML(subject)}"</div>
    <div class="emoji-grid">
      ${EMOJI_OPTIONS.map(e => `
        <button type="button" class="emoji-btn${getEmoji(subject) === e ? ' active' : ''}" data-em="${e}">${e}</button>
      `).join("")}
    </div>
  `;
  box.querySelectorAll(".emoji-btn").forEach(b => {
    b.addEventListener("click", e => {
      e.preventDefault();
      setEmoji(subject, b.getAttribute("data-em"));
      renderSubjects();
      renderSuggest(document.getElementById("subject").value);
    });
  });
  box.classList.add("show");
}

function openSuggest() {
  const box = document.getElementById("subjectSuggestions");
  if (!box) return;
  renderSuggest(document.getElementById("subject").value);
  box.classList.add("show");
}
function closeSuggest() {
  const box = document.getElementById("subjectSuggestions");
  if (box) box.classList.remove("show");
}

function initSubjectPicker() {
  const input = document.getElementById("subject");
  const arrow = document.getElementById("subjectPickerArrow");
  if (!input || !arrow) return;

  input.addEventListener("focus", openSuggest);
  input.addEventListener("input", openSuggest);

  arrow.addEventListener("mousedown", e => {
    e.preventDefault();
    const box = document.getElementById("subjectSuggestions");
    if (box.classList.contains("show")) closeSuggest();
    else { input.focus(); openSuggest(); }
  });

  document.addEventListener("mousedown", e => {
    const wrap = document.querySelector(".subject-wrap");
    if (wrap && !wrap.contains(e.target)) closeSuggest();
  });
}

/* ==================================================================
   RENDER
================================================================== */
function render() {
  renderOverview();
  renderSubjects();
  renderSchedule();
}

/* ==================================================================
   BUTTONS
================================================================== */
const addBtn = document.getElementById("addBtn");
if (addBtn) addBtn.addEventListener("click", addClass);

const clearBtn = document.getElementById("clearBtn");
if (clearBtn) clearBtn.addEventListener("click", clearForm);

const resetBtn = document.getElementById("resetBtn");
if (resetBtn) resetBtn.addEventListener("click", resetAll);

const exportBtn = document.getElementById("exportBtn");
if (exportBtn) exportBtn.addEventListener("click", exportCSV);

/* ==================================================================
   BUTTON HOVER TRACK
================================================================== */
document.querySelectorAll(".btn-add").forEach(btn => {
  btn.addEventListener("mousemove", (e) => {
    const rect = btn.getBoundingClientRect();
    btn.style.setProperty("--x", ((e.clientX - rect.left) / rect.width * 100) + "%");
    btn.style.setProperty("--y", ((e.clientY - rect.top) / rect.height * 100) + "%");
  });
});

/* ==================================================================
   KEYBOARD
================================================================== */
document.addEventListener("keydown", e => {
  const tag = (e.target.tagName || "").toLowerCase();
  if (tag === "input" || tag === "textarea" || tag === "select") return;
  if (e.key === "v" || e.key === "V") setMode("view");
  else if (e.key === "e" || e.key === "E") setMode("edit");
  else if (e.key === "Escape") closeSuggest();
});

/* ==================================================================
   INIT
================================================================== */
initSubjectPicker();
initSubjectSection();
setMode(currentMode, false);
updatePendingBadge();
loadData(true).then(() => {
  if (queue.length > 0) flushQueue();
});
</script>
