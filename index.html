<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0f">
<title>Attendance — Studio</title>
<link rel="icon" type="image/x-icon" href="/icons8-attendance-stickers-96.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

<style>
/* ================================================================
   DESIGN SYSTEM — v2 "Studio"
   ================================================================ */
:root {
  --bg: #f8f6f1;
  --bg-2: #efeae0;
  --surface: #ffffff;
  --surface-2: #fbfaf6;
  --surface-3: #f0ede4;
  --surface-glass: rgba(255, 255, 255, 0.72);
  --text: #0a0a0c;
  --text-2: #3b3b42;
  --text-3: #86868f;
  --text-4: #b0b0b8;
  --line: #e6e2d6;
  --line-2: #d4cfbe;
  --line-3: #c0b9a3;

  --accent: #ff5b23;
  --accent-2: #ff8a4c;
  --accent-soft: #fff2ea;
  --accent-deep: #c93c07;
  --accent-glow: rgba(255, 91, 35, 0.35);

  --present: #0a8f5c;
  --present-2: #14b874;
  --present-soft: #e6f7ef;
  --absent: #d62828;
  --absent-2: #f04444;
  --absent-soft: #fdeaea;
  --cancel: #b17a00;
  --cancel-2: #e6a600;
  --cancel-soft: #fdf4d8;
  --info: #0d6efd;
  --info-soft: #e6f0ff;

  --gradient-warm: linear-gradient(135deg, #ff5b23 0%, #ff8a4c 45%, #ffb37a 100%);
  --gradient-cool: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #d946ef 100%);
  --gradient-mesh: 
    radial-gradient(at 12% 8%, rgba(255, 91, 35, 0.18), transparent 45%),
    radial-gradient(at 88% 12%, rgba(99, 102, 241, 0.12), transparent 42%),
    radial-gradient(at 22% 92%, rgba(20, 184, 116, 0.10), transparent 45%),
    radial-gradient(at 92% 88%, rgba(217, 70, 239, 0.10), transparent 45%);

  --radius-2xl: 36px;
  --radius-xl: 28px;
  --radius-lg: 20px;
  --radius: 14px;
  --radius-sm: 10px;
  --radius-xs: 8px;

  --shadow-xs: 0 1px 2px rgba(20, 20, 20, 0.04);
  --shadow-sm: 0 2px 6px -1px rgba(20, 20, 20, 0.06), 0 1px 3px rgba(20, 20, 20, 0.04);
  --shadow: 0 8px 24px -8px rgba(20, 20, 20, 0.10), 0 4px 12px -4px rgba(20, 20, 20, 0.06);
  --shadow-lg: 0 32px 64px -24px rgba(20, 20, 20, 0.16), 0 12px 32px -12px rgba(20, 20, 20, 0.10);
  --shadow-xl: 0 48px 96px -32px rgba(20, 20, 20, 0.22), 0 16px 48px -16px rgba(20, 20, 20, 0.12);
  --shadow-pop: 0 24px 56px -20px rgba(255, 91, 35, 0.42);
  --shadow-inner: inset 0 1px 0 rgba(255, 255, 255, 0.6);

  --ease: cubic-bezier(0.32, 0.72, 0, 1);
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
  --ease-elastic: cubic-bezier(0.68, -0.55, 0.265, 1.55);
}

html[data-theme="dark"] {
  --bg: #07070b;
  --bg-2: #0d0d14;
  --surface: #12121a;
  --surface-2: #181822;
  --surface-3: #20202c;
  --surface-glass: rgba(18, 18, 26, 0.72);
  --text: #f5f5f7;
  --text-2: #c0c0c8;
  --text-3: #7a7a86;
  --text-4: #4a4a55;
  --line: #24242e;
  --line-2: #32323f;
  --line-3: #444450;

  --accent: #ff6b35;
  --accent-2: #ff8a4c;
  --accent-soft: #241510;
  --accent-deep: #ff8555;
  --accent-glow: rgba(255, 107, 53, 0.4);

  --present: #2ecc8f;
  --present-2: #4dd9a0;
  --present-soft: #0d2e22;
  --absent: #ff5252;
  --absent-2: #ff6b6b;
  --absent-soft: #3a1414;
  --cancel: #ffc043;
  --cancel-2: #ffd066;
  --cancel-soft: #2e2410;
  --info: #4d94ff;
  --info-soft: #0f1e38;

  --gradient-warm: linear-gradient(135deg, #ff6b35 0%, #ff8a4c 45%, #ffb37a 100%);
  --gradient-cool: linear-gradient(135deg, #818cf8 0%, #a78bfa 50%, #e879f9 100%);
  --gradient-mesh:
    radial-gradient(at 12% 8%, rgba(255, 107, 53, 0.20), transparent 45%),
    radial-gradient(at 88% 12%, rgba(129, 140, 248, 0.14), transparent 42%),
    radial-gradient(at 22% 92%, rgba(46, 204, 143, 0.12), transparent 45%),
    radial-gradient(at 92% 88%, rgba(232, 121, 249, 0.12), transparent 45%);

  --shadow-xs: 0 1px 2px rgba(0, 0, 0, 0.5);
  --shadow-sm: 0 2px 6px -1px rgba(0, 0, 0, 0.6), 0 1px 3px rgba(0, 0, 0, 0.4);
  --shadow: 0 8px 24px -8px rgba(0, 0, 0, 0.7), 0 4px 12px -4px rgba(0, 0, 0, 0.5);
  --shadow-lg: 0 32px 64px -24px rgba(0, 0, 0, 0.8), 0 12px 32px -12px rgba(0, 0, 0, 0.6);
  --shadow-xl: 0 48px 96px -32px rgba(0, 0, 0, 0.9), 0 16px 48px -16px rgba(0, 0, 0, 0.7);
  --shadow-pop: 0 24px 56px -20px rgba(255, 107, 53, 0.55);
  --shadow-inner: inset 0 1px 0 rgba(255, 255, 255, 0.06);
}

/* ================================================================
   RESET
   ================================================================ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html {
  overscroll-behavior-y: contain;
  -webkit-text-size-adjust: 100%;
  scroll-behavior: smooth;
}

body {
  font-family: 'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  line-height: 1.5;
  font-feature-settings: "ss01", "cv11", "tnum";
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  transition: background 0.5s var(--ease), color 0.5s var(--ease);
  position: relative;
  overflow-x: hidden;
}

/* ================================================================
   AMBIENT BACKGROUND — animated mesh + particles
   ================================================================ */
.bg-mesh {
  position: fixed;
  inset: -20%;
  z-index: 0;
  pointer-events: none;
  background: var(--gradient-mesh);
  animation: meshShift 24s ease-in-out infinite;
  will-change: transform, background-position;
}

@keyframes meshShift {
  0%, 100% { transform: translate(0, 0) scale(1); }
  33% { transform: translate(2%, -3%) scale(1.05); }
  66% { transform: translate(-3%, 2%) scale(0.97); }
}

.bg-grid {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  opacity: 0.35;
  background-image:
    linear-gradient(var(--line) 1px, transparent 1px),
    linear-gradient(90deg, var(--line) 1px, transparent 1px);
  background-size: 56px 56px;
  mask-image: radial-gradient(ellipse at center, black 30%, transparent 75%);
  -webkit-mask-image: radial-gradient(ellipse at center, black 30%, transparent 75%);
}

html[data-theme="dark"] .bg-grid { opacity: 0.18; }

.bg-particles {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  overflow: hidden;
}

.particle {
  position: absolute;
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: var(--accent);
  opacity: 0;
  animation: floatUp 18s linear infinite;
  will-change: transform, opacity;
}

@keyframes floatUp {
  0% { transform: translateY(100vh) scale(0.5); opacity: 0; }
  10% { opacity: 0.5; }
  90% { opacity: 0.4; }
  100% { transform: translateY(-10vh) scale(1); opacity: 0; }
}

/* ================================================================
   CURSOR GLOW (desktop only)
   ================================================================ */
.cursor-glow {
  position: fixed;
  width: 500px;
  height: 500px;
  border-radius: 50%;
  pointer-events: none;
  z-index: 0;
  background: radial-gradient(circle, var(--accent-glow), transparent 55%);
  opacity: 0.35;
  transform: translate(-50%, -50%);
  transition: opacity 0.3s var(--ease);
  will-change: transform;
  filter: blur(40px);
}

@media (hover: none) { .cursor-glow { display: none; } }

/* ================================================================
   SHELL
   ================================================================ */
.shell {
  position: relative;
  z-index: 2;
  width: min(1220px, calc(100% - 40px));
  margin: 0 auto;
  padding: 28px 0 120px;
}

/* ================================================================
   TOPBAR
   ================================================================ */
.topbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
  padding: 12px 0 32px;
  flex-wrap: wrap;
}

.brand {
  display: flex;
  align-items: center;
  gap: 16px;
}

.brand-mark {
  width: 56px;
  height: 56px;
  border-radius: 18px;
  background: var(--gradient-warm);
  color: #fff;
  display: grid;
  place-items: center;
  font-family: 'Instrument Serif', serif;
  font-size: 38px;
  font-style: italic;
  line-height: 1;
  padding-bottom: 6px;
  box-shadow: var(--shadow-pop);
  transition: transform 0.5s var(--ease-spring);
  position: relative;
  overflow: hidden;
  cursor: default;
  user-select: none;
}

.brand-mark::before {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.4), transparent 60%);
  opacity: 0;
  transition: opacity 0.4s;
}

.brand-mark::after {
  content: '';
  position: absolute;
  inset: -50%;
  background: conic-gradient(from 0deg, transparent 0deg, rgba(255,255,255,0.5) 60deg, transparent 120deg);
  animation: brandSweep 6s linear infinite;
  opacity: 0.4;
}

@keyframes brandSweep {
  to { transform: rotate(360deg); }
}

.brand-mark:hover {
  transform: rotate(-10deg) scale(1.08);
}

.brand-mark:hover::before { opacity: 1; }

.brand-text h1 {
  font-family: 'Instrument Serif', serif;
  font-size: 30px;
  font-weight: 400;
  letter-spacing: -0.025em;
  line-height: 1;
  margin: 0;
  position: relative;
}

.brand-text h1 em {
  font-style: italic;
  background: var(--gradient-warm);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  background-size: 200% 200%;
  animation: gradientPan 6s ease-in-out infinite;
}

@keyframes gradientPan {
  0%, 100% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
}

.brand-text p {
  font-size: 12px;
  color: var(--text-3);
  margin-top: 5px;
  font-weight: 500;
  letter-spacing: 0.02em;
  display: flex;
  align-items: center;
  gap: 6px;
}

.brand-text p::before {
  content: '';
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: var(--present);
  box-shadow: 0 0 8px var(--present);
  animation: breathe 2s ease-in-out infinite;
}

@keyframes breathe {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.4; transform: scale(0.8); }
}

.topbar-actions {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}

/* Segmented mode switch */
.segment {
  display: inline-flex;
  padding: 4px;
  background: var(--surface-glass);
  border: 1px solid var(--line);
  border-radius: 999px;
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  box-shadow: var(--shadow-sm), var(--shadow-inner);
  position: relative;
}

.segment::before {
  content: '';
  position: absolute;
  top: 4px;
  left: 4px;
  height: calc(100% - 8px);
  width: calc(50% - 2px);
  background: var(--surface);
  border-radius: 999px;
  box-shadow: var(--shadow-xs);
  transition: transform 0.4s var(--ease-spring);
  pointer-events: none;
}

.segment[data-mode="edit"]::before {
  transform: translateX(calc(100% + 4px));
}

.segment button {
  border: 0;
  background: transparent;
  padding: 8px 20px;
  border-radius: 999px;
  font-family: inherit;
  font-size: 13px;
  font-weight: 600;
  color: var(--text-3);
  cursor: pointer;
  transition: color 0.3s var(--ease);
  white-space: nowrap;
  position: relative;
  z-index: 1;
}

.segment button.active { color: var(--text); }

/* Sync pill */
.pill {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 10px 16px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: var(--surface-glass);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  color: var(--text-2);
  font-family: inherit;
  font-size: 13px;
  font-weight: 600;
  transition: all 0.3s var(--ease);
  white-space: nowrap;
  box-shadow: var(--shadow-xs);
}

.pill .dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--present);
  box-shadow: 0 0 0 4px color-mix(in srgb, var(--present) 20%, transparent);
  animation: breathe 2.4s ease-in-out infinite;
  flex-shrink: 0;
  position: relative;
}

.pill .dot::after {
  content: '';
  position: absolute;
  inset: -2px;
  border-radius: 50%;
  background: var(--present);
  opacity: 0.4;
  animation: ping 2.4s cubic-bezier(0, 0, 0.2, 1) infinite;
}

@keyframes ping {
  0% { transform: scale(1); opacity: 0.6; }
  100% { transform: scale(2.5); opacity: 0; }
}

.pill.syncing { color: var(--cancel); }
.pill.syncing .dot { background: var(--cancel); box-shadow: 0 0 0 4px color-mix(in srgb, var(--cancel) 20%, transparent); }
.pill.syncing .dot::after { background: var(--cancel); }
.pill.offline { color: var(--absent); }
.pill.offline .dot { background: var(--absent); box-shadow: none; }
.pill.offline .dot::after { display: none; }

.pill .count {
  background: var(--accent);
  color: #fff;
  font-size: 10px;
  font-weight: 800;
  padding: 2px 7px;
  border-radius: 999px;
  min-width: 18px;
  text-align: center;
  animation: pulseOnce 0.6s var(--ease-spring);
}

@keyframes pulseOnce {
  0% { transform: scale(0); }
  60% { transform: scale(1.2); }
  100% { transform: scale(1); }
}

/* Icon button */
.icon-btn {
  width: 42px;
  height: 42px;
  border-radius: 50%;
  border: 1px solid var(--line);
  background: var(--surface-glass);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  color: var(--text-2);
  display: grid;
  place-items: center;
  cursor: pointer;
  transition: all 0.35s var(--ease);
  font-family: inherit;
  position: relative;
  overflow: hidden;
}

.icon-btn::before {
  content: '';
  position: absolute;
  inset: 0;
  background: var(--gradient-warm);
  opacity: 0;
  transition: opacity 0.3s var(--ease);
}

.icon-btn > * { position: relative; z-index: 1; }

.icon-btn:hover {
  border-color: transparent;
  color: #fff;
  transform: translateY(-2px) scale(1.05);
  box-shadow: var(--shadow-pop);
}

.icon-btn:hover::before { opacity: 1; }

.icon-btn.spinning svg { animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ================================================================
   BANNERS
   ================================================================ */
.banner {
  display: none;
  align-items: center;
  gap: 12px;
  padding: 14px 20px;
  border-radius: var(--radius-lg);
  font-size: 13px;
  font-weight: 600;
  margin-bottom: 16px;
  border: 1px solid;
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  animation: slideDown 0.4s var(--ease);
}

@keyframes slideDown {
  from { opacity: 0; transform: translateY(-12px); }
  to { opacity: 1; transform: translateY(0); }
}

.banner.show { display: flex; }

.banner.offline {
  background: color-mix(in srgb, var(--absent-soft) 85%, transparent);
  color: var(--absent);
  border-color: color-mix(in srgb, var(--absent) 30%, transparent);
}

.banner.queue {
  background: color-mix(in srgb, var(--cancel-soft) 85%, transparent);
  color: var(--cancel);
  border-color: color-mix(in srgb, var(--cancel) 30%, transparent);
}

.banner .ghost {
  margin-left: auto;
  padding: 6px 14px;
  font-size: 12px;
  color: inherit;
  border-color: currentColor;
}

.banner .ghost:hover {
  background: currentColor;
  color: #fff;
  border-color: currentColor;
}

/* ================================================================
   HERO (add class)
   ================================================================ */
.hero {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius-2xl);
  padding: 40px;
  margin-bottom: 24px;
  box-shadow: var(--shadow-lg);
  position: relative;
  overflow: hidden;
  isolation: isolate;
}

.hero::before {
  content: '';
  position: absolute;
  top: -50%;
  right: -20%;
  width: 500px;
  height: 500px;
  background: radial-gradient(circle, var(--accent-glow), transparent 60%);
  pointer-events: none;
  opacity: 0.5;
  animation: heroGlow 12s ease-in-out infinite;
}

@keyframes heroGlow {
  0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.5; }
  50% { transform: translate(-5%, 5%) scale(1.15); opacity: 0.7; }
}

.hero::after {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: inherit;
  background: linear-gradient(180deg, var(--shadow-inner), transparent 20%);
  pointer-events: none;
}

.hero-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  margin-bottom: 28px;
  gap: 12px;
  flex-wrap: wrap;
  position: relative;
  z-index: 1;
}

.hero-head h2 {
  font-family: 'Instrument Serif', serif;
  font-size: 42px;
  font-weight: 400;
  letter-spacing: -0.03em;
  line-height: 1;
  display: flex;
  align-items: baseline;
  gap: 12px;
  flex-wrap: wrap;
}

.hero-head h2 em {
  font-style: italic;
  background: var(--gradient-warm);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  background-size: 200% 200%;
  animation: gradientPan 8s ease-in-out infinite;
}

.hero-head .tag {
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--text-3);
  padding: 6px 12px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--surface-2);
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.hero-head .tag::before {
  content: '';
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 6px var(--accent);
  animation: breathe 1.6s ease-in-out infinite;
}

.form-row {
  display: grid;
  grid-template-columns: 1fr 1.5fr auto;
  gap: 14px;
  align-items: end;
  position: relative;
  z-index: 1;
}

.field {
  display: flex;
  flex-direction: column;
  gap: 8px;
  position: relative;
}

.field label {
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--text-3);
  padding-left: 4px;
  transition: color 0.2s var(--ease);
}

.field:focus-within label { color: var(--accent); }

.input {
  width: 100%;
  height: 56px;
  border: 1.5px solid var(--line);
  border-radius: var(--radius);
  background: var(--bg);
  padding: 0 18px;
  font-family: inherit;
  font-size: 15px;
  font-weight: 500;
  color: var(--text);
  outline: none;
  transition: all 0.3s var(--ease);
  box-shadow: var(--shadow-xs);
}

.input:hover { border-color: var(--line-2); }

.input:focus {
  border-color: var(--accent);
  background: var(--surface);
  box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 14%, transparent), var(--shadow-sm);
  transform: translateY(-1px);
}

.input::placeholder { color: var(--text-4); font-weight: 400; }

.subject-wrap { position: relative; }
.subject-wrap .input { padding-right: 52px; }

.subject-arrow {
  position: absolute;
  top: 50%;
  right: 8px;
  transform: translateY(-50%);
  width: 40px;
  height: 40px;
  border: 0;
  background: transparent;
  color: var(--text-3);
  border-radius: 12px;
  cursor: pointer;
  display: grid;
  place-items: center;
  transition: all 0.3s var(--ease);
  font-family: inherit;
  font-size: 16px;
}

.subject-arrow:hover {
  background: var(--accent-soft);
  color: var(--accent);
  transform: translateY(-50%) rotate(180deg);
}

.suggest {
  position: absolute;
  top: calc(100% + 8px);
  left: 0;
  right: 0;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-xl);
  max-height: 280px;
  overflow-y: auto;
  padding: 8px;
  z-index: 60;
  display: none;
}

.suggest.show {
  display: block;
  animation: pop 0.25s var(--ease-spring);
}

@keyframes pop {
  from { opacity: 0; transform: translateY(-8px) scale(0.96); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

.suggest-item {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  padding: 10px 12px;
  border: 0;
  background: transparent;
  border-radius: var(--radius);
  font-family: inherit;
  font-size: 14px;
  font-weight: 500;
  color: var(--text);
  text-align: left;
  cursor: pointer;
  transition: all 0.2s var(--ease);
}

.suggest-item:hover {
  background: var(--surface-2);
  color: var(--accent);
  transform: translateX(4px);
}

.suggest-item .emoji {
  width: 34px;
  height: 34px;
  border-radius: 10px;
  background: var(--surface-2);
  display: grid;
  place-items: center;
  font-size: 16px;
  flex-shrink: 0;
  transition: transform 0.3s var(--ease-spring);
}

.suggest-item:hover .emoji { transform: scale(1.15) rotate(-8deg); }

.suggest-item .name {
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.suggest-item .edit {
  width: 28px;
  height: 28px;
  border: 0;
  background: transparent;
  color: var(--text-3);
  border-radius: 8px;
  cursor: pointer;
  opacity: 0;
  transition: all 0.2s var(--ease);
}

.suggest-item:hover .edit { opacity: 1; }
.suggest-item .edit:hover { background: var(--accent-soft); color: var(--accent); }

/* Add button */
.btn-add {
  height: 56px;
  padding: 0 32px;
  border: 0;
  border-radius: var(--radius);
  background: var(--gradient-warm);
  background-size: 200% 200%;
  color: #fff;
  font-family: inherit;
  font-size: 15px;
  font-weight: 700;
  letter-spacing: 0.01em;
  cursor: pointer;
  transition: all 0.4s var(--ease-spring);
  box-shadow: var(--shadow-pop);
  display: inline-flex;
  align-items: center;
  gap: 10px;
  white-space: nowrap;
  position: relative;
  overflow: hidden;
  animation: gradientPan 6s ease-in-out infinite;
}

.btn-add::before {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(circle at var(--x, 50%) var(--y, 50%), rgba(255,255,255,0.5), transparent 40%);
  opacity: 0;
  transition: opacity 0.3s;
}

.btn-add:hover:not(:disabled) {
  transform: translateY(-3px) scale(1.02);
  box-shadow: 0 32px 72px -24px var(--accent-glow);
}

.btn-add:hover::before { opacity: 1; }

.btn-add:active:not(:disabled) { transform: translateY(0) scale(0.98); }

.btn-add:disabled { opacity: 0.6; cursor: not-allowed; }

.btn-add .arrow {
  display: inline-block;
  transition: transform 0.3s var(--ease-spring);
}

.btn-add:hover .arrow { transform: translateX(4px); }

.hero-actions {
  display: flex;
  justify-content: flex-end;
  gap: 10px;
  margin-top: 22px;
  flex-wrap: wrap;
  position: relative;
  z-index: 1;
}

.ghost {
  padding: 10px 18px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: transparent;
  color: var(--text-2);
  font-family: inherit;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.25s var(--ease);
  position: relative;
  overflow: hidden;
}

.ghost:hover {
  background: var(--surface-2);
  border-color: var(--accent);
  color: var(--accent);
  transform: translateY(-1px);
}

.ghost.danger:hover {
  background: var(--absent-soft);
  border-color: var(--absent);
  color: var(--absent);
}

.flash {
  margin-top: 18px;
  padding: 14px 20px;
  border-radius: var(--radius);
  font-size: 13px;
  font-weight: 600;
  display: none;
  position: relative;
  z-index: 1;
  overflow: hidden;
}

.flash::before {
  content: '';
  position: absolute;
  bottom: 0;
  left: 0;
  height: 3px;
  width: 100%;
  background: currentColor;
  animation: flashBar 3.5s linear;
  transform-origin: left;
}

@keyframes flashBar {
  from { transform: scaleX(1); }
  to { transform: scaleX(0); }
}

.flash.success { display: block; background: var(--present-soft); color: var(--present); animation: pop 0.3s var(--ease-spring); }
.flash.error { display: block; background: var(--absent-soft); color: var(--absent); animation: shake 0.5s var(--ease); }
.flash.info { display: block; background: var(--accent-soft); color: var(--accent-deep); animation: pop 0.3s var(--ease-spring); }

@keyframes shake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-8px); }
  75% { transform: translateX(8px); }
}

/* ================================================================
   OVERVIEW TILES
   ================================================================ */
.overview {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
  margin-bottom: 24px;
}

.tile {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius-xl);
  padding: 26px;
  position: relative;
  overflow: hidden;
  transition: all 0.4s var(--ease);
  isolation: isolate;
}

.tile::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, var(--tile-glow, transparent), transparent 40%);
  opacity: 0;
  transition: opacity 0.4s var(--ease);
  pointer-events: none;
}

.tile:hover {
  transform: translateY(-4px);
  box-shadow: var(--shadow-lg);
  border-color: var(--line-2);
}

.tile:hover::before { opacity: 1; }

.tile.accent { --tile-glow: rgba(255, 91, 35, 0.10); }
.tile.cancel { --tile-glow: rgba(230, 166, 0, 0.10); }

.tile-label {
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--text-3);
  margin-bottom: 14px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.tile-label .mini-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 8px var(--accent);
}

.tile.cancel .tile-label .mini-dot { background: var(--cancel); box-shadow: 0 0 8px var(--cancel); }
.tile:not(.accent):not(.cancel) .tile-label .mini-dot { background: var(--text-3); box-shadow: none; }

.tile-value {
  font-family: 'Instrument Serif', serif;
  font-size: 64px;
  font-weight: 400;
  line-height: 1;
  letter-spacing: -0.04em;
  color: var(--text);
  font-variant-numeric: tabular-nums;
  position: relative;
  z-index: 1;
}

.tile.accent .tile-value {
  background: var(--gradient-warm);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.tile.cancel .tile-value { color: var(--cancel); }

.tile-deco {
  position: absolute;
  top: 20px;
  right: 20px;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 12px var(--accent);
  animation: breathe 2.4s ease-in-out infinite;
}

.tile.cancel .tile-deco { background: var(--cancel); box-shadow: 0 0 12px var(--cancel); }

/* ================================================================
   PANEL (generic container)
   ================================================================ */
.panel {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius-2xl);
  padding: 32px;
  margin-bottom: 24px;
  box-shadow: var(--shadow-sm);
  position: relative;
}

.panel-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  margin-bottom: 24px;
  flex-wrap: wrap;
}

.panel-head h2 {
  font-family: 'Instrument Serif', serif;
  font-size: 32px;
  font-weight: 400;
  letter-spacing: -0.025em;
  line-height: 1.1;
  display: flex;
  align-items: baseline;
  gap: 10px;
}

.panel-head h2 em {
  font-style: italic;
  background: var(--gradient-warm);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  background-size: 200% 200%;
  animation: gradientPan 8s ease-in-out infinite;
}

.panel-head-right {
  display: flex;
  align-items: center;
  gap: 10px;
}

.hint {
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--text-3);
  padding: 6px 12px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--surface-2);
}

.toggle {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  border: 1px solid var(--line);
  background: var(--surface-2);
  color: var(--text-2);
  cursor: pointer;
  display: grid;
  place-items: center;
  transition: all 0.35s var(--ease);
  font-family: inherit;
  font-size: 14px;
}

.toggle:hover {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
  transform: rotate(180deg);
}

.toggle.collapsed { transform: rotate(-90deg); }
.toggle.collapsed:hover { transform: rotate(-90deg) scale(1.1); }

.collapse {
  display: grid;
  grid-template-rows: 1fr;
  transition: grid-template-rows 0.4s var(--ease);
}

.collapse > div { overflow: hidden; }
.collapse.collapsed { grid-template-rows: 0fr; }

/* ================================================================
   SUBJECT LIST
   ================================================================ */
.subject-list {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.subj {
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  background: var(--surface-2);
  overflow: hidden;
  transition: all 0.4s var(--ease);
  position: relative;
}

.subj::before {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: inherit;
  background: linear-gradient(135deg, color-mix(in srgb, var(--tone) 4%, transparent), transparent 40%);
  opacity: 0;
  transition: opacity 0.4s;
  pointer-events: none;
}

.subj:hover::before { opacity: 1; }

.subj.open {
  background: var(--surface);
  border-color: var(--line-2);
  box-shadow: var(--shadow);
}

.subj-row {
  display: grid;
  grid-template-columns: 60px 1fr 220px 36px;
  align-items: center;
  gap: 20px;
  padding: 18px 22px;
  cursor: pointer;
  user-select: none;
  transition: background 0.25s var(--ease);
  position: relative;
  min-height: 86px;
}

.subj-row::before {
  content: '';
  position: absolute;
  left: 0;
  top: 18px;
  bottom: 18px;
  width: 4px;
  border-radius: 0 4px 4px 0;
  background: var(--tone, var(--accent));
  transition: all 0.3s var(--ease);
}

.subj:hover .subj-row::before {
  top: 12px;
  bottom: 12px;
  width: 5px;
  box-shadow: 0 0 12px var(--tone, var(--accent));
}

.subj-icon {
  width: 60px;
  height: 60px;
  border-radius: 18px;
  display: grid;
  place-items: center;
  font-size: 28px;
  background: color-mix(in srgb, var(--tone, var(--accent)) 14%, var(--surface-3));
  flex-shrink: 0;
  transition: transform 0.4s var(--ease-spring);
  position: relative;
  overflow: hidden;
}

.subj-icon::before {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.35), transparent 50%);
  opacity: 0;
  transition: opacity 0.3s;
}

.subj:hover .subj-icon { transform: scale(1.08) rotate(-6deg); }
.subj:hover .subj-icon::before { opacity: 1; }

.subj-name {
  font-family: 'Instrument Serif', serif;
  font-size: 24px;
  font-weight: 400;
  letter-spacing: -0.015em;
  color: var(--text);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  line-height: 1.2;
  transition: color 0.2s;
}

.subj.open .subj-name { color: var(--accent); }

.subj-bar {
  display: flex;
  align-items: center;
  gap: 14px;
}

.track {
  flex: 1;
  height: 8px;
  background: var(--surface-3);
  border-radius: 999px;
  overflow: hidden;
  position: relative;
}

.track::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
  animation: shine 3s ease-in-out infinite;
  transform: translateX(-100%);
}

@keyframes shine {
  0% { transform: translateX(-100%); }
  50% { transform: translateX(100%); }
  100% { transform: translateX(100%); }
}

.fill {
  height: 100%;
  background: linear-gradient(90deg, var(--tone, var(--accent)), color-mix(in srgb, var(--tone, var(--accent)) 60%, white));
  border-radius: 999px;
  transition: width 1s var(--ease-out);
  box-shadow: 0 0 12px color-mix(in srgb, var(--tone, var(--accent)) 40%, transparent);
  position: relative;
}

.subj-pct {
  font-family: 'Instrument Serif', serif;
  font-size: 24px;
  font-weight: 400;
  font-variant-numeric: tabular-nums;
  color: var(--text);
  min-width: 60px;
  text-align: right;
  line-height: 1;
  transition: color 0.3s;
}

.subj-pct.low { color: var(--absent); }

.subj-chevron {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: var(--surface);
  border: 1px solid var(--line);
  color: var(--text-3);
  display: grid;
  place-items: center;
  transition: all 0.4s var(--ease-spring);
  flex-shrink: 0;
  font-size: 14px;
}

.subj.open .subj-chevron {
  transform: rotate(180deg);
  background: var(--accent);
  color: #fff;
  border-color: var(--accent);
  box-shadow: 0 4px 16px var(--accent-glow);
}

.subj-body {
  display: grid;
  grid-template-rows: 0fr;
  transition: grid-template-rows 0.4s var(--ease);
}

.subj-body > div { overflow: hidden; }

.subj.open .subj-body { grid-template-rows: 1fr; }

.subj-log {
  padding: 8px 22px 22px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  border-top: 1px solid var(--line);
  margin-top: 4px;
  animation: logIn 0.5s var(--ease) 0.05s backwards;
}

@keyframes logIn {
  from { opacity: 0; transform: translateY(-8px); }
  to { opacity: 1; transform: translateY(0); }
}

.log-row {
  display: grid;
  grid-template-columns: 140px 1fr auto;
  align-items: center;
  gap: 16px;
  padding: 12px 16px;
  background: var(--surface-2);
  border: 1px solid transparent;
  border-radius: var(--radius);
  font-size: 13px;
  transition: all 0.25s var(--ease);
}

.log-row:hover {
  border-color: var(--line-2);
  background: var(--surface);
  transform: translateX(4px);
}

.log-date {
  font-weight: 700;
  color: var(--text);
  font-variant-numeric: tabular-nums;
  font-size: 13px;
}

.log-day {
  font-size: 11px;
  font-weight: 700;
  color: var(--text-3);
  margin-top: 2px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.log-empty {
  padding: 26px;
  text-align: center;
  color: var(--text-3);
  font-size: 13px;
}

/* ================================================================
   STATUS CHIPS
   ================================================================ */
.chip {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 7px 14px;
  border-radius: 999px;
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  white-space: nowrap;
  justify-self: end;
  transition: all 0.3s var(--ease);
  position: relative;
}

.chip::before {
  content: '';
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: currentColor;
  box-shadow: 0 0 6px currentColor;
}

.chip.present {
  background: var(--present-soft);
  color: var(--present);
}

.chip.absent {
  background: var(--absent-soft);
  color: var(--absent);
}

.chip.cancelled {
  background: var(--cancel-soft);
  color: var(--cancel);
}

.chip.unmarked {
  background: var(--surface-3);
  color: var(--text-3);
}

.chip.unmarked::before { box-shadow: none; opacity: 0.6; }

/* ================================================================
   WEEK SCHEDULE
   ================================================================ */
.week {
  border: 1px solid var(--line);
  border-radius: var(--radius-xl);
  background: var(--surface-2);
  overflow: hidden;
  margin-bottom: 14px;
  transition: all 0.35s var(--ease);
}

.week:last-child { margin-bottom: 0; }

.week:hover { border-color: var(--line-2); }

.week-head {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 20px 24px;
  cursor: pointer;
  user-select: none;
  transition: background 0.25s var(--ease);
  min-height: 78px;
  position: relative;
}

.week-head::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--accent) 4%, transparent), transparent);
  opacity: 0;
  transition: opacity 0.35s;
  pointer-events: none;
}

.week-head:hover::after { opacity: 1; }

.week-num {
  font-family: 'Instrument Serif', serif;
  font-size: 32px;
  font-weight: 400;
  line-height: 1;
  background: var(--gradient-warm);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  width: 56px;
  height: 56px;
  border-radius: 18px;
  background-color: var(--accent-soft);
  display: grid;
  place-items: center;
  flex-shrink: 0;
  font-variant-numeric: tabular-nums;
  position: relative;
  box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 20%, transparent);
}

.week-meta {
  display: flex;
  flex-direction: column;
  gap: 3px;
  min-width: 0;
}

.week-title {
  font-size: 16px;
  font-weight: 700;
  letter-spacing: -0.015em;
}

.week-sub {
  font-size: 12px;
  font-weight: 500;
  color: var(--text-3);
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
}

.week-sub .mini {
  display: inline-flex;
  align-items: center;
  gap: 5px;
}

.week-sub .mini::before {
  content: '';
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: currentColor;
  box-shadow: 0 0 4px currentColor;
}

.week-sub .mini.p { color: var(--present); }
.week-sub .mini.a { color: var(--absent); }
.week-sub .mini.c { color: var(--cancel); }

.week-chev {
  margin-left: auto;
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: var(--surface);
  border: 1px solid var(--line);
  color: var(--text-3);
  display: grid;
  place-items: center;
  transition: all 0.4s var(--ease-spring);
  flex-shrink: 0;
}

.week.closed .week-chev { transform: rotate(-90deg); }

.week:hover .week-chev {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
}

.week-body {
  display: grid;
  grid-template-rows: 1fr;
  transition: grid-template-rows 0.45s var(--ease);
}

.week-body > div { overflow: hidden; }

.week.closed .week-body { grid-template-rows: 0fr; }

.class-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 16px;
  padding: 6px 24px 24px;
}

/* ================================================================
   CLASS CARD
   ================================================================ */
.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius-xl);
  padding: 22px;
  position: relative;
  overflow: hidden;
  transition: all 0.35s var(--ease);
  touch-action: pan-y;
  animation: rise 0.5s var(--ease) backwards;
  isolation: isolate;
}

@keyframes rise {
  from { opacity: 0; transform: translateY(12px) scale(0.98); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

.card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  width: 4px;
  height: 100%;
  background: var(--tone, var(--accent));
  transition: all 0.35s var(--ease);
}

.card::after {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: inherit;
  background: radial-gradient(circle at var(--cx, 50%) var(--cy, 50%), color-mix(in srgb, var(--tone, var(--accent)) 8%, transparent), transparent 50%);
  opacity: 0;
  transition: opacity 0.4s;
  pointer-events: none;
}

.card:hover {
  transform: translateY(-4px);
  box-shadow: var(--shadow-lg);
  border-color: var(--line-2);
}

.card:hover::before { width: 6px; box-shadow: 0 0 16px var(--tone, var(--accent)); }
.card:hover::after { opacity: 1; }

.card.cancelled-card {
  background: var(--surface-2);
}

.card.cancelled-card::before { opacity: 0.35; }

.card.swiping { transition: transform 0.12s var(--ease); }

.card-head {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 10px;
  margin-bottom: 16px;
}

.card-date {
  font-family: 'Instrument Serif', serif;
  font-size: 24px;
  font-weight: 400;
  letter-spacing: -0.015em;
  line-height: 1.15;
}

.card-day {
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--text-3);
  margin-top: 4px;
}

.card-subj {
  font-size: 15px;
  font-weight: 700;
  letter-spacing: -0.01em;
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  gap: 10px;
  word-break: break-word;
}

.card-subj .dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--tone, var(--accent));
  flex-shrink: 0;
  box-shadow: 0 0 10px var(--tone, var(--accent));
  animation: breathe 2.4s ease-in-out infinite;
}

.card.cancelled-card .card-subj {
  text-decoration: line-through;
  text-decoration-color: color-mix(in srgb, var(--text) 30%, transparent);
  text-decoration-thickness: 1.5px;
  opacity: 0.7;
}

.card-status {
  display: flex;
  justify-content: flex-start;
  margin-bottom: 18px;
}

.card-actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

.card-actions .wide { grid-column: 1 / -1; }

.act {
  padding: 12px 16px;
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  background: var(--surface-2);
  color: var(--text-2);
  font-family: inherit;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.02em;
  cursor: pointer;
  transition: all 0.25s var(--ease);
  min-height: 44px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  position: relative;
  overflow: hidden;
}

.act:hover:not(:disabled) {
  transform: translateY(-2px);
  box-shadow: var(--shadow-sm);
}

.act:active:not(:disabled) { transform: translateY(0); }
.act:disabled { opacity: 0.5; cursor: not-allowed; }

.act.present {
  background: var(--present-soft);
  color: var(--present);
  border-color: transparent;
}
.act.present:hover:not(:disabled) {
  background: var(--present);
  color: #fff;
  box-shadow: 0 4px 16px color-mix(in srgb, var(--present) 40%, transparent);
}

.act.absent {
  background: var(--absent-soft);
  color: var(--absent);
  border-color: transparent;
}
.act.absent:hover:not(:disabled) {
  background: var(--absent);
  color: #fff;
  box-shadow: 0 4px 16px color-mix(in srgb, var(--absent) 40%, transparent);
}

.act.cancel {
  background: var(--cancel-soft);
  color: var(--cancel);
  border-color: transparent;
}
.act.cancel:hover:not(:disabled) {
  background: var(--cancel);
  color: #fff;
  box-shadow: 0 4px 16px color-mix(in srgb, var(--cancel) 40%, transparent);
}

.act.uncancel {
  background: var(--accent-soft);
  color: var(--accent-deep);
  border-color: transparent;
}
.act.uncancel:hover:not(:disabled) {
  background: var(--accent);
  color: #fff;
  box-shadow: 0 4px 16px var(--accent-glow);
}

.act.del { background: transparent; }
.act.del:hover:not(:disabled) {
  background: var(--absent-soft);
  color: var(--absent);
  border-color: var(--absent);
}

.mode-view .card-actions { display: none; }
.mode-view .hero { display: none; }
.mode-view .hero-actions { display: none; }

/* ================================================================
   EMPTY & SKELETON
   ================================================================ */
.empty {
  text-align: center;
  padding: 80px 24px;
  border: 2px dashed var(--line-2);
  border-radius: var(--radius-xl);
  background: var(--surface-2);
  position: relative;
  overflow: hidden;
}

.empty::before {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(circle at 50% 50%, color-mix(in srgb, var(--accent) 6%, transparent), transparent 60%);
  animation: breathe 4s ease-in-out infinite;
}

.empty-icon {
  font-size: 64px;
  display: block;
  margin-bottom: 20px;
  opacity: 0.55;
  animation: bob 3s ease-in-out infinite;
  position: relative;
}

@keyframes bob {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-8px); }
}

.empty-title {
  font-family: 'Instrument Serif', serif;
  font-size: 26px;
  font-weight: 400;
  color: var(--text);
  margin-bottom: 10px;
  position: relative;
}

.empty-desc {
  font-size: 13px;
  color: var(--text-3);
  margin-bottom: 24px;
  position: relative;
}

.skel {
  height: 86px;
  border-radius: var(--radius-xl);
  background: var(--surface-2);
  border: 1px solid var(--line);
  position: relative;
  overflow: hidden;
}

.skel::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--text) 5%, transparent), transparent);
  animation: shimmer 1.8s infinite;
}

@keyframes shimmer {
  from { transform: translateX(-100%); }
  to { transform: translateX(100%); }
}

.skel-stack { display: flex; flex-direction: column; gap: 12px; }

/* ================================================================
   EMOJI PICKER
   ================================================================ */
.emoji-grid {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 4px;
  padding: 10px;
  margin-top: 6px;
  background: var(--surface-2);
  border-radius: var(--radius);
  border: 1px solid var(--line);
}

.emoji-btn {
  width: 38px;
  height: 38px;
  border: 0;
  background: transparent;
  border-radius: 10px;
  font-size: 20px;
  cursor: pointer;
  transition: all 0.2s var(--ease-spring);
  display: grid;
  place-items: center;
}

.emoji-btn:hover {
  background: var(--surface);
  transform: scale(1.2) rotate(-6deg);
}

.emoji-btn.active {
  background: var(--accent-soft);
  box-shadow: inset 0 0 0 2px var(--accent);
}

.emoji-title {
  padding: 12px 14px 6px;
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--text-3);
}

/* ================================================================
   CONFETTI
   ================================================================ */
.confetti {
  position: fixed;
  width: 10px;
  height: 10px;
  pointer-events: none;
  z-index: 9999;
  border-radius: 2px;
  animation: drop 2s cubic-bezier(0.2, 0.6, 0.4, 1) forwards;
  will-change: transform, opacity;
}

@keyframes drop {
  0% { transform: translateY(0) rotate(0) scale(1); opacity: 1; }
  100% { transform: translateY(100vh) rotate(1080deg) scale(0.4); opacity: 0; }
}

/* ================================================================
   SCROLLBAR
   ================================================================ */
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb {
  background: var(--line-2);
  border-radius: 999px;
  border: 2px solid var(--bg);
}
::-webkit-scrollbar-thumb:hover { background: var(--line-3); }

/* ================================================================
   RESPONSIVE
   ================================================================ */
@media (max-width: 980px) {
  .hero { padding: 32px; }
  .hero-head h2 { font-size: 36px; }
  .form-row { grid-template-columns: 1fr 1fr; }

  .brand-mark { width: 44px; height: 44px; font-size: 30px; border-radius: 14px; padding-bottom: 4px; }

  .icon-btn { width: 44px; height: 44px; }

  .hero { padding: 24px; border-radius: 28px; }

}

@media (max-width: 680px) and (hover: none) {

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;

</head>

<body>

<!-- AMBIENT BACKGROUND -->
<div class="bg-mesh"></div>
<div class="bg-grid"></div>
<div class="bg-particles" id="particles"></div>
<div class="cursor-glow" id="cursorGlow"></div>

<div class="shell">

  <!-- TOPBAR -->
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">A</div>
      <div class="brand-text">
        <h1>Atten<em>dance</em></h1>

      </div>
    </div>
    <div class="topbar-actions">
      <div class="segment" id="modeSegment" role="group" aria-label="Mode">

      </button>
      <button class="icon-btn" id="refreshBtn" aria-label="Refresh">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">

      </button>
      <button class="icon-btn" id="themeToggle" aria-label="Toggle theme">🌙</button>
    </div>
  </header>

  <!-- BANNERS -->
  <div class="banner offline" id="offlineBanner">⚠️ Offline — changes queued, will sync automatically.</div>
  <div class="banner queue" id="queueBanner">
    <span id="queueText">⏳ Changes waiting to sync</span>

  <!-- ADD CLASS -->
  <section class="hero" id="addClassSection">
    <div class="hero-head">
      <h2>Add a <em>class</em></h2>

      </div>
      <div class="field">
        <label>Subject</label>

      <div class="tile-deco"></div>

  <!-- SUBJECTS -->
  <section class="panel">
    <div class="panel-head">
      <h2>By <em>subject</em></h2>
      <div class="panel-head-right">
        <span class="hint">Tap to expand</span>
        <button class="toggle" id="subjectSectionToggle" aria-label="Collapse">⌄</button>
      </div>
    </div>
    <div class="collapse" id="subjectSectionBody">
      <div>
        <div id="subjectStats" class="subject-list">
          <div class="skel-stack">
            <div class="skel"></div>
            <div class="skel"></div>

  <!-- SCHEDULE -->

      </div>
    </div>
    <div id="schedule">

        <div class="empty-title">Loading…</div>
      </div>
    </div>

</div>

<script>
/* ==================================================================
   CONFIG
================================================================== */
const API_URL = "https://script.google.com/macros/s/AKfycbxryV1UhZClPxP8m95HerdLGEZOV_T1Gp-YLy7-2KUBn_6H__LlMP-KgCzzoVB91aZIcA/exec";
const QUEUE_KEY = "attendance_queue_v2";
const EMOJI_KEY = "attendance_subject_emojis";
const EXPANDED_SUBJECTS_KEY = "attendance_expanded_subjects";
const SUBJECT_SECTION_COLLAPSED_KEY = "attendance_subject_section_collapsed";
const REQUEST_TIMEOUT_MS = 15000;

/* ==================================================================
   STATE
================================================================== */
let classes = [];
let currentMode = localStorage.getItem("mode") || "view";
let lastSyncTime = null;
let queue = loadQueue();
let subjectEmojis = loadEmojis();
let expandedSubjects = loadExpandedSubjects();
let loadingInFlight = false;

let syncLocks = 0;
let lastFlushAt = 0;
let syncingSince = 0;
let lastQueueLength = 0;

const EMOJI_OPTIONS = ["📚","🧪","📐","💻","🎨","🌍","⚗️","🧠","📖","🔬","🎵","💡","📊","🏛️","🧬","⚙️","🎯","🔭","🗺️","📝"];

/* ==================================================================
   AMBIENT PARTICLES
================================================================== */
(function initParticles() {
  const container = document.getElementById("particles");
  if (!container) return;
  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;

  const count = window.innerWidth < 640 ? 8 : 18;
  for (let i = 0; i < count; i++) {
    const p = document.createElement("div");
    p.className = "particle";
    p.style.left = Math.random() * 100 + "%";
    p.style.animationDelay = (Math.random() * 18) + "s";
    p.style.animationDuration = (14 + Math.random() * 8) + "s";
    const size = 3 + Math.random() * 3;
    p.style.width = size + "px";
    p.style.height = size + "px";
    p.style.opacity = (0.3 + Math.random() * 0.4);
    container.appendChild(p);
  }
})();

/* ==================================================================
   CURSOR GLOW
================================================================== */
(function initCursorGlow() {
  const glow = document.getElementById("cursorGlow");
  if (!glow) return;
  if (window.matchMedia("(hover: none)").matches) return;
  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;

  let tx = window.innerWidth / 2;
  let ty = window.innerHeight / 2;
  let cx = tx;
  let cy = ty;

  document.addEventListener("mousemove", (e) => {
    tx = e.clientX;
    ty = e.clientY;
  });

  function loop() {
    cx += (tx - cx) * 0.12;
    cy += (ty - cy) * 0.12;
    glow.style.transform = `translate(${cx}px, ${cy}px) translate(-50%, -50%)`;
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();

/* ==================================================================
   THEME
================================================================== */
const themeToggle = document.getElementById("themeToggle");
const htmlElement = document.documentElement;

function initTheme() {
  const saved = localStorage.getItem("theme") || "light";
  htmlElement.setAttribute("data-theme", saved);
  if (themeToggle) themeToggle.textContent = saved === "dark" ? "☀️" : "🌙";
}

function toggleTheme() {
  const current = htmlElement.getAttribute("data-theme");
  const next = current === "dark" ? "light" : "dark";
  htmlElement.setAttribute("data-theme", next);
  localStorage.setItem("theme", next);
  if (themeToggle) themeToggle.textContent = next === "dark" ? "☀️" : "🌙";
}

if (themeToggle) themeToggle.addEventListener("click", toggleTheme);
initTheme();

/* ==================================================================
   EMOJI + EXPANDED
================================================================== */
function loadEmojis() {
  try { return JSON.parse(localStorage.getItem(EMOJI_KEY) || "{}"); }
  catch { return {}; }
}
function saveEmojis() {
  try { localStorage.setItem(EMOJI_KEY, JSON.stringify(subjectEmojis)); } catch {}
}
function getEmoji(subject) { return subjectEmojis[subject] || "📚"; }
function setEmoji(subject, emoji) { subjectEmojis[subject] = emoji; saveEmojis(); }

function loadExpandedSubjects() {
  try { return new Set(JSON.parse(localStorage.getItem(EXPANDED_SUBJECTS_KEY) || "[]")); }
  catch { return new Set(); }
}
function saveExpandedSubjects() {
  try { localStorage.setItem(EXPANDED_SUBJECTS_KEY, JSON.stringify([...expandedSubjects])); } catch {}
}
function toggleExpandedSubject(subject) {
  if (expandedSubjects.has(subject)) expandedSubjects.delete(subject);
  else expandedSubjects.add(subject);
  saveExpandedSubjects();
}

function initSubjectSection() {
  const body = document.getElementById("subjectSectionBody");
  const btn = document.getElementById("subjectSectionToggle");
  if (!body || !btn) return;
  const collapsed = localStorage.getItem(SUBJECT_SECTION_COLLAPSED_KEY) === "1";
  body.classList.toggle("collapsed", collapsed);
  btn.classList.toggle("collapsed", collapsed);

  btn.addEventListener("click", () => {
    const nowCollapsed = !body.classList.contains("collapsed");
    body.classList.toggle("collapsed", nowCollapsed);
    btn.classList.toggle("collapsed", nowCollapsed);
    localStorage.setItem(SUBJECT_SECTION_COLLAPSED_KEY, nowCollapsed ? "1" : "0");
  });
}

/* ==================================================================
   MODE
================================================================== */
const modeSegment = document.getElementById("modeSegment");
const modeViewBtn = document.getElementById("modeViewBtn");
const modeEditBtn = document.getElementById("modeEditBtn");

function setMode(mode, persist = true) {
  currentMode = mode;
  if (modeViewBtn) modeViewBtn.classList.toggle("active", mode === "view");
  if (modeEditBtn) modeEditBtn.classList.toggle("active", mode === "edit");
  if (modeSegment) modeSegment.setAttribute("data-mode", mode);
  document.body.classList.toggle("mode-view", mode === "view");
  document.body.classList.toggle("mode-edit", mode === "edit");
  if (persist) localStorage.setItem("mode", mode);
  renderSchedule();
}

if (modeViewBtn) modeViewBtn.addEventListener("click", () => setMode("view"));
if (modeEditBtn) modeEditBtn.addEventListener("click", () => setMode("edit"));

/* ==================================================================
   SYNC LOCK
================================================================== */
function lockSync() {
  syncLocks++;
  if (syncLocks === 1) {
    syncingSince = Date.now();
    lastQueueLength = queue.length;
    setCloudStatus("syncing");
  }
}
function unlockSync() {
  syncLocks = Math.max(0, syncLocks - 1);
  if (syncLocks === 0) { syncingSince = 0; updateOnlineState(); }
}

setInterval(() => {
  if (syncLocks > 0 && syncingSince > 0) {
    const elapsed = Date.now() - syncingSince;
    if (elapsed > 20000 && queue.length === lastQueueLength) {
      console.warn("Sync watchdog: forcing reset");
      syncLocks = 0; syncingSince = 0; updateOnlineState();
    } else if (queue.length !== lastQueueLength) {
      syncingSince = Date.now();
      lastQueueLength = queue.length;
    }
  }
}, 3000);

/* ==================================================================
   CLOUD STATUS
================================================================== */
const cloudStatus = document.getElementById("cloudStatus");
const cloudText = document.getElementById("cloudText");
const pendingBadge = document.getElementById("pendingBadge");
const offlineBanner = document.getElementById("offlineBanner");
const queueBanner = document.getElementById("queueBanner");
const queueText = document.getElementById("queueText");

function setCloudStatus(state) {
  if (!cloudStatus) return;
  cloudStatus.classList.remove("synced", "syncing", "offline");
  cloudStatus.classList.add(state);
  if (!cloudText) return;
  if (state === "syncing") {
    cloudText.textContent = "Syncing…";
  } else if (state === "offline") {
    cloudText.textContent = navigator.onLine ? "Retrying…" : "Offline";
  } else {
    if (lastSyncTime) {
      const sec = Math.floor((Date.now() - lastSyncTime) / 1000);
      let label = "just now";
      if (sec >= 60) label = Math.floor(sec / 60) + "m ago";
      else if (sec > 5) label = sec + "s ago";
      cloudText.textContent = "Synced · " + label;
    } else {
      cloudText.textContent = "Synced";
    }
  }
}

function updatePendingBadge() {
  if (!pendingBadge) return;
  if (queue.length > 0) {
    pendingBadge.style.display = "inline-block";
    pendingBadge.textContent = queue.length;
    if (queueBanner) queueBanner.classList.add("show");
    if (queueText) queueText.textContent = "⏳ " + queue.length + " change" + (queue.length !== 1 ? "s" : "") + " waiting to sync";
  } else {
    pendingBadge.style.display = "none";
    if (queueBanner) queueBanner.classList.remove("show");
  }
}

function updateOnlineState() {
  if (!navigator.onLine) {
    setCloudStatus("offline");
    if (offlineBanner) offlineBanner.classList.add("show");
  } else {
    if (offlineBanner) offlineBanner.classList.remove("show");
    if (syncLocks === 0) setCloudStatus("synced");
  }
}

window.addEventListener("online", () => {
  updateOnlineState();
  if (queue.length > 0) flushQueue();
  else loadData(true);
});

window.addEventListener("offline", updateOnlineState);
updateOnlineState();

setInterval(() => {
  if (syncLocks === 0 && navigator.onLine && lastSyncTime) setCloudStatus("synced");
}, 30000);

/* ==================================================================
   QUEUE
================================================================== */
function loadQueue() {
  try {
    const raw = localStorage.getItem(QUEUE_KEY);
    return raw ? JSON.parse(raw) : [];
  } catch { return []; }
}
function saveQueue() {
  try { localStorage.setItem(QUEUE_KEY, JSON.stringify(queue)); }
  catch (e) { console.warn("queue save failed", e); }
  updatePendingBadge();
}
function enqueue(payload) {
  if (payload.action === "update") {
    const idx = queue.findIndex(q => q.action === "update" && q.id === payload.id);
    if (idx >= 0) queue[idx] = payload;
    else queue.push(payload);
  } else if (payload.action === "delete") {
    queue = queue.filter(q => q.id !== payload.id);
    queue.push(payload);
  } else if (payload.action === "add") {
    const idx = queue.findIndex(q => q.action === "add" && q.id === payload.id);
    if (idx >= 0) queue[idx] = payload;
    else queue.push(payload);
  } else {
    queue.push(payload);
  }
  saveQueue();
}

async function flushQueue() {
  if (syncLocks > 0 && syncingSince > 0 && Date.now() - syncingSince < 1000) return;
  if (queue.length === 0 || !navigator.onLine) return;

  lockSync();
  const totalAtStart = queue.length;
  let processed = 0;
  try {
    while (queue.length > 0 && navigator.onLine) {
      const payload = queue[0];
      try {
        await sendToSheet(payload);
        queue.shift();
        saveQueue();
        processed++;
        if (queue.length > 0 && queueText) {
          queueText.textContent = "⏳ Syncing " + processed + " of " + totalAtStart + "…";
        }
      } catch (err) {
        console.warn("flush failed", err);
        break;
      }
    }
  } finally {
    unlockSync();
  }

  if (processed > 0) {
    lastSyncTime = Date.now();
    if (queue.length === 0) {
      showMessage("Synced " + processed + " pending change" + (processed !== 1 ? "s" : "") + ".", "success");
      const shouldReload = processed >= 5 || (Date.now() - lastFlushAt > 30000);
      lastFlushAt = Date.now();
      if (shouldReload) await loadData(true);
    } else {
      updateOnlineState();
    }
  }
  updatePendingBadge();
}

const flushBtn = document.getElementById("flushQueueBtn");
if (flushBtn) flushBtn.addEventListener("click", flushQueue);

/* ==================================================================
   DATE HELPERS
================================================================== */
function getDay(date) {
  return new Date(date + "T00:00:00").toLocaleDateString("en-US", { weekday: "long" });
}
function formatDate(date) {
  return new Date(date + "T00:00:00").toLocaleDateString("en-GB", {
    weekday: "short", day: "2-digit", month: "short"
  });
}
function formatDateShort(date) {
  return new Date(date + "T00:00:00").toLocaleDateString("en-GB", {
    day: "2-digit", month: "short"
  });
}
function getWeek(date) {
  const start = new Date("2026-09-07T00:00:00");
  const current = new Date(date + "T00:00:00");
  const diff = Math.floor((current - start) / (1000 * 60 * 60 * 24));
  if (diff < 0) return 0;
  return Math.floor(diff / 7) + 1;
}

/* ==================================================================
   STATUS
================================================================== */
function isCancelled(item) {
  if (typeof item.cancelled === "boolean") return item.cancelled;
  return item.status === "CANCELLED";
}

/* ==================================================================
   SUBJECT COLOR
================================================================== */
const SUBJECT_PALETTE = [
  "#ff5b23", "#0ea5e9", "#8b5cf6", "#10b981",
  "#f59e0b", "#ec4899", "#06b6d4", "#6366f1",
  "#84cc16", "#ef4444"
];
function subjectColor(name) {
  let h = 0;
  const s = String(name || "");
  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
  return SUBJECT_PALETTE[h % SUBJECT_PALETTE.length];
}

/* ==================================================================
   API
================================================================== */
async function loadData(silent = false) {
  if (!navigator.onLine) { setCloudStatus("offline"); return; }
  if (loadingInFlight) return;
  loadingInFlight = true;
  if (!silent) lockSync();
  try {
    const res = await fetchWithTimeout(API_URL + "?t=" + Date.now(), { method: "GET" }, REQUEST_TIMEOUT_MS);
    const data = await res.json();
    classes = Array.isArray(data) ? data : [];
    lastSyncTime = Date.now();
    if (!silent) unlockSync();
    updateOnlineState();
    render();
  } catch (err) {
    console.error(err);
    if (!silent) unlockSync();
    setCloudStatus("offline");
    if (!silent) showMessage("Unable to connect to Google Sheets.", "error");
  } finally {
    loadingInFlight = false;
  }
}

async function fetchWithTimeout(url, options = {}, timeoutMs = REQUEST_TIMEOUT_MS) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), timeoutMs);
  try {
    return await fetch(url, { ...options, signal: controller.signal });
  } finally {
    clearTimeout(timer);
  }
}

async function sendToSheet(payload) {
  await fetchWithTimeout(API_URL, {
    method: "POST", mode: "no-cors",
    body: JSON.stringify(payload)
  }, REQUEST_TIMEOUT_MS);
}

async function addClass() {
  if (currentMode !== "edit") return;

  const date = document.getElementById("date").value;
  const subject = document.getElementById("subject").value.trim();

  if (!date) { showMessage("Please pick a date.", "error"); return; }
  if (!subject) { showMessage("Please add a subject.", "error"); return; }

  const dup = classes.some(i => i.date === date && i.subject.toLowerCase() === subject.toLowerCase());
  if (dup) { showMessage("That class already exists.", "error"); return; }

  const item = {
    id: Date.now().toString() + Math.random().toString(36).slice(2, 7),
    date,
    day: getDay(date),
    subject,
    cancelled: false,
    attendance: ""
  };

  const addBtn = document.getElementById("addBtn");
  addBtn.disabled = true;
  addBtn.textContent = "Saving…";

  classes.push(item);
  render();
  clearForm();
  if (navigator.vibrate) navigator.vibrate(8);

  const payload = { action: "add", ...item };

  if (!navigator.onLine) {
    enqueue(payload);
    showMessage("Offline — will sync later.", "info");
    addBtn.disabled = false;
    addBtn.innerHTML = 'Add class <span class="arrow">→</span>';
    updateOnlineState();
    return;
  }

  lockSync();
  try {
    await sendToSheet(payload);
    lastSyncTime = Date.now();
    showMessage("Class added.", "success");
  } catch (err) {
    enqueue(payload);
    showMessage("Saved locally, will retry.", "info");
  } finally {
    unlockSync();
    addBtn.disabled = false;
    addBtn.innerHTML = 'Add class <span class="arrow">→</span>';
  }
}

/* ==================================================================
   MARK ATTENDANCE
================================================================== */
async function markAttendance(id, attendance, btn) {
  const item = classes.find(x => x.id === id);
  if (!item || isCancelled(item)) return;

  if (navigator.vibrate) navigator.vibrate(6);
  if (btn) { btn.disabled = true; btn.textContent = "…"; }

  item.attendance = attendance;
  render();

  const payload = { action: "update", id, attendance };

  if (!navigator.onLine) {
    enqueue(payload); updateOnlineState(); return;
  }

  lockSync();
  try {
    await sendToSheet(payload);
    lastSyncTime = Date.now();
    checkPerfectAttendance(item.subject);
  } catch (err) {
    enqueue(payload);
  } finally {
    unlockSync();
  }
}

/* ==================================================================
   TOGGLE CANCEL
================================================================== */
async function toggleCancelled(id, btn) {
  const item = classes.find(x => x.id === id);
  if (!item) return;

  if (navigator.vibrate) navigator.vibrate(6);

  const newVal = !isCancelled(item);
  item.cancelled = newVal;
  item.attendance = "";

  render();

  const payload = { action: "update", id, cancelled: newVal, attendance: "" };

  if (!navigator.onLine) {
    enqueue(payload); updateOnlineState();
    showMessage(newVal ? "Cancelled (offline)." : "Un-cancelled (offline).", "info");
    return;
  }

  lockSync();
  try {
    await sendToSheet(payload);
    lastSyncTime = Date.now();
    showMessage(newVal ? "Marked as cancelled." : "Marked as class.", "success");
  } catch (err) {
    enqueue(payload);
  } finally {
    unlockSync();
  }
}

/* ==================================================================
   PERFECT ATTENDANCE
================================================================== */
function checkPerfectAttendance(subject) {
  const items = classes.filter(c => c.subject === subject && !isCancelled(c));
  if (items.length < 5) return;
  const marked = items.filter(c => c.attendance);
  if (marked.length !== items.length) return;
  const allPresent = items.every(c => c.attendance === "PRESENT");
  if (allPresent) fireConfetti();
}

function fireConfetti() {
  const colors = ["#ff5b23", "#0ea5e9", "#8b5cf6", "#10b981", "#f59e0b", "#ec4899"];
  for (let i = 0; i < 60; i++) {
    const p = document.createElement("div");
    p.className = "confetti";
    p.style.left = Math.random() * 100 + "vw";
    p.style.top = "-20px";
    p.style.background = colors[Math.floor(Math.random() * colors.length)];
    p.style.animationDelay = Math.random() * 0.5 + "s";
    p.style.animationDuration = (1.4 + Math.random() * 1) + "s";
    const shapes = ["2px", "50%", "0"];
    p.style.borderRadius = shapes[Math.floor(Math.random() * shapes.length)];
    document.body.appendChild(p);
    setTimeout(() => p.remove(), 3000);
  }
}

/* ==================================================================
   CSV
================================================================== */
function exportCSV() {
  if (!classes.length) { showMessage("No data to export.", "error"); return; }
  const headers = ["id", "date", "day", "subject", "cancelled", "attendance"];
  const rows = [headers.join(",")];
  [...classes].sort((a, b) => a.date.localeCompare(b.date)).forEach(item => {
    const n = {
      id: item.id,
      date: item.date,
      day: item.day,
      subject: item.subject,
      cancelled: isCancelled(item) ? "TRUE" : "FALSE",
      attendance: item.attendance || ""
    };
    const row = headers.map(h => {
      const val = String(n[h] ?? "");
      return /[",\n]/.test(val) ? '"' + val.replace(/"/g, '""') + '"' : val;
    });
    rows.push(row.join(","));
  });
  const blob = new Blob([rows.join("\n")], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "attendance-" + new Date().toISOString().slice(0, 10) + ".csv";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showMessage("Exported " + classes.length + " records.", "success");
}

/* ==================================================================
   COUNT
================================================================== */
function animateCount(el, target) {
  if (!el) return;
  const current = parseInt(el.getAttribute("data-count") || "0", 10);
  if (current === target) { el.textContent = target; return; }
  el.setAttribute("data-count", target);
  const duration = 700;
  const start = performance.now();
  const from = current;
  function step(now) {
    const t = Math.min(1, (now - start) / duration);
    const eased = 1 - Math.pow(1 - t, 4);
    el.textContent = Math.round(from + (target - from) * eased);
    if (t < 1) requestAnimationFrame(step);
    else el.textContent = target;
  }
  requestAnimationFrame(step);
}

    const total = present + absent;
    const pct = total ? Math.round((present / total) * 100) : 0;

/* ==================================================================
   SWIPE
================================================================== */
let tX = 0, tY = 0, tCard = null, tTime = 0;

function attachSwipe(card, item) {
  if (currentMode !== "edit") return;
  if (!("ontouchstart" in window)) return;
  if (isCancelled(item)) return;

  card.addEventListener("touchstart", e => {
    if (e.touches.length !== 1) return;
    tX = e.touches[0].clientX;
    tY = e.touches[0].clientY;
    tTime = Date.now();
    tCard = card;
    card.classList.add("swiping");
  }, { passive: true });

  card.addEventListener("touchmove", e => {
    if (!tCard || e.touches.length !== 1) return;
    const dx = e.touches[0].clientX - tX;
    const dy = e.touches[0].clientY - tY;
    if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 8) {
      const t = Math.max(-120, Math.min(120, dx));
      tCard.style.transform = `translateX(${t}px)`;
    }
  }, { passive: true });

  card.addEventListener("touchend", e => {
    if (!tCard) return;
    const dx = e.changedTouches[0].clientX - tX;
    const dy = e.changedTouches[0].clientY - tY;
    const dt = Date.now() - tTime;
    tCard.classList.remove("swiping");
    tCard.style.transform = "";
    if (dx > 80 && Math.abs(dy) < 50 && dt < 600) markAttendance(item.id, "PRESENT");
    else if (dx < -80 && Math.abs(dy) < 50 && dt < 600) deleteClass(item.id);
    tCard = null;
  }, { passive: true });

  card.addEventListener("touchcancel", () => {
    if (tCard) { tCard.classList.remove("swiping"); tCard.style.transform = ""; }
    tCard = null;
  }, { passive: true });
}

   SCHEDULE

  }

  const sorted = [...classes].sort((a, b) => a.date.localeCompare(b.date));
  const weeks = {};
  sorted.forEach(i => {
    const w = getWeek(i.date);
    if (!weeks[w]) weeks[w] = [];
    weeks[w].push(i);
  });

  const openWeeks = new Set(
    [...container.querySelectorAll(".week:not(.closed)")]
