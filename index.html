<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0b10">
<title>Presence — attendance tracker</title>
<link rel="icon" type="image/x-icon" href="/icons8-attendance-stickers-96.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
/* ═══════════════════════════════════════════════════════════════
   PRESENCE — design system
   Dark-first editorial dashboard
   ═══════════════════════════════════════════════════════════════ */

:root {
  /* surfaces — dark is the default state */
  --bg:        #0a0b10;
  --bg-2:      #0f1118;
  --panel:     #131620;
  --panel-2:   #1a1e2b;
  --panel-3:   #232838;
  --ink:       #f4f5f8;
  --ink-2:     #b4b8c6;
  --ink-3:     #787d92;
  --ink-4:     #4a4f63;
  --rule:      #232838;
  --rule-2:    #2d3346;
  --rule-3:    #3d4459;

  /* accent — lime signal color */
  --lime:      #d4ff4d;
  --lime-2:    #e8ff8a;
  --lime-dim:  #8fa829;
  --lime-glow: rgba(212, 255, 77, 0.35);

  /* status */
  --present:   #4ade80;
  --present-b: rgba(74, 222, 128, 0.14);
  --absent:    #f87171;
  --absent-b:  rgba(248, 113, 113, 0.14);
  --cancel:    #fbbf24;
  --cancel-b:  rgba(251, 191, 36, 0.14);
  --neutral-b: rgba(120, 125, 146, 0.14);

  --radius:    14px;
  --radius-lg: 22px;
  --radius-xl: 30px;
  --rule-w:    1px;

  --ease:      cubic-bezier(0.32, 0.72, 0, 1);
  --ease-spring: cubic-bezier(0.34, 1.4, 0.5, 1);
}

/* light mode — inverted, warm paper feel */
html[data-theme="light"] {
  --bg:        #f4f2ec;
  --bg-2:      #ebe8e0;
  --panel:     #ffffff;
  --panel-2:   #f8f6f0;
  --panel-3:   #efece4;
  --ink:       #0f1118;
  --ink-2:     #40444f;
  --ink-3:     #737682;
  --ink-4:     #a5a8b3;
  --rule:      #e5e1d6;
  --rule-2:    #d6d1c2;
  --rule-3:    #b8b2a0;

  --lime:      #7d9e1a;
  --lime-2:    #a5c935;
  --lime-dim:  #5c7414;
  --lime-glow: rgba(125, 158, 26, 0.30);

  --present:   #16a34a;
  --present-b: rgba(22, 163, 74, 0.12);
  --absent:    #dc2626;
  --absent-b:  rgba(220, 38, 38, 0.12);
  --cancel:    #ca8a04;
  --cancel-b:  rgba(202, 138, 4, 0.12);
  --neutral-b: rgba(115, 118, 130, 0.12);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  overscroll-behavior-y: contain;
  -webkit-text-size-adjust: 100%;
}

body {
  font-family: 'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg);
  color: var(--ink);
  min-height: 100vh;
  line-height: 1.5;
  font-feature-settings: "ss01", "tnum";
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  transition: background 0.5s var(--ease), color 0.5s var(--ease);
  overflow-x: hidden;
}

/* subtle noise texture overlay */
body::after {
  content: '';
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 1;
  opacity: 0.028;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
}

/* ═══════════════════════════════════════════════════════════════
   LAYOUT
   ═══════════════════════════════════════════════════════════════ */

.wrap {
  position: relative;
  z-index: 2;
  width: min(1280px, calc(100% - 40px));
  margin: 0 auto;
  padding: 24px 0 96px;
}

/* ═══════════════════════════════════════════════════════════════
   MASTHEAD
   ═══════════════════════════════════════════════════════════════ */

.masthead {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 24px;
  padding: 8px 0 32px;
  border-bottom: var(--rule-w) solid var(--rule);
  margin-bottom: 40px;
  flex-wrap: wrap;
}

.masthead-brand {
  display: flex;
  align-items: baseline;
  gap: 18px;
  flex-wrap: wrap;
}

.masthead-title {
  font-family: 'Instrument Serif', serif;
  font-size: 40px;
  font-weight: 400;
  letter-spacing: -0.028em;
  line-height: 1;
  margin: 0;
}

.masthead-title em {
  font-style: italic;
  color: var(--lime);
}

.masthead-tag {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ink-3);
  padding: 4px 10px;
  border: var(--rule-w) solid var(--rule-2);
  border-radius: 4px;
}

.masthead-controls {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

/* Mode toggle — a hard, mechanical switch */
.mode-toggle {
  display: inline-flex;
  border: var(--rule-w) solid var(--rule-2);
  border-radius: 8px;
  overflow: hidden;
  background: var(--panel);
}

.mode-toggle button {
  border: 0;
  background: transparent;
  padding: 8px 14px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--ink-3);
  cursor: pointer;
  transition: all 0.2s var(--ease);
  display: flex;
  align-items: center;
  gap: 6px;
}

.mode-toggle button + button {
  border-left: var(--rule-w) solid var(--rule-2);
}

.mode-toggle button.active {
  background: var(--lime);
  color: var(--bg);
}

.mode-toggle button:not(.active):hover {
  background: var(--panel-2);
  color: var(--ink);
}

/* status chip */
.status-chip {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 8px 14px;
  border: var(--rule-w) solid var(--rule-2);
  border-radius: 8px;
  background: var(--panel);
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.04em;
  color: var(--ink-2);
  transition: all 0.3s var(--ease);
  white-space: nowrap;
}

.status-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--present);
  position: relative;
  flex-shrink: 0;
}

.status-dot::before {
  content: '';
  position: absolute;
  inset: -3px;
  border-radius: 50%;
  background: var(--present);
  opacity: 0.35;
  animation: radar 2s ease-out infinite;
}

@keyframes radar {
  0% { transform: scale(1); opacity: 0.5; }
  100% { transform: scale(2.2); opacity: 0; }
}

.status-chip.syncing { color: var(--cancel); border-color: var(--cancel); }
.status-chip.syncing .status-dot { background: var(--cancel); }
.status-chip.syncing .status-dot::before { background: var(--cancel); }

.status-chip.offline { color: var(--absent); border-color: var(--absent); }
.status-chip.offline .status-dot { background: var(--absent); }
.status-chip.offline .status-dot::before { display: none; }

.status-chip .qcount {
  background: var(--lime);
  color: var(--bg);
  font-weight: 700;
  padding: 1px 6px;
  border-radius: 3px;
  font-size: 10px;
  margin-left: 2px;
}

.icon-btn {
  width: 38px;
  height: 38px;
  border: var(--rule-w) solid var(--rule-2);
  border-radius: 8px;
  background: var(--panel);
  color: var(--ink-2);
  display: grid;
  place-items: center;
  cursor: pointer;
  transition: all 0.25s var(--ease);
  font-family: inherit;
  font-size: 15px;
}

.icon-btn:hover {
  border-color: var(--lime);
  color: var(--lime);
  transform: translateY(-1px);
}

.icon-btn:active { transform: translateY(0) scale(0.95); }
.icon-btn.spin svg { animation: spin 0.9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ═══════════════════════════════════════════════════════════════
   BANNERS
   ═══════════════════════════════════════════════════════════════ */

.banner {
  display: none;
  align-items: center;
  gap: 12px;
  padding: 12px 18px;
  border-radius: var(--radius);
  font-size: 13px;
  font-weight: 500;
  margin-bottom: 20px;
  border: var(--rule-w) solid;
  font-family: 'JetBrains Mono', monospace;
  letter-spacing: 0.02em;
}

.banner.show { display: flex; }

.banner.offline {
  background: var(--absent-b);
  color: var(--absent);
  border-color: var(--absent);
}

.banner.queue {
  background: var(--cancel-b);
  color: var(--cancel);
  border-color: var(--cancel);
}

.banner .ghost {
  margin-left: auto;
  padding: 6px 12px;
  font-size: 11px;
  color: inherit;
  border-color: currentColor;
}

/* ═══════════════════════════════════════════════════════════════
   DASHBOARD GRID
   ═══════════════════════════════════════════════════════════════ */

.dashboard {
  display: grid;
  grid-template-columns: 1fr 400px;
  gap: 32px;
  align-items: start;
}

.col-main { min-width: 0; display: flex; flex-direction: column; gap: 32px; }
.col-side { position: sticky; top: 24px; display: flex; flex-direction: column; gap: 24px; }

/* ═══════════════════════════════════════════════════════════════
   SECTION HEADS
   ═══════════════════════════════════════════════════════════════ */

.section {
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.section-head {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 16px;
  padding-bottom: 12px;
  border-bottom: var(--rule-w) solid var(--rule);
  flex-wrap: wrap;
}

.section-title {
  font-family: 'Instrument Serif', serif;
  font-size: 30px;
  font-weight: 400;
  letter-spacing: -0.025em;
  line-height: 1;
  display: flex;
  align-items: baseline;
  gap: 12px;
}

.section-title em {
  font-style: italic;
  color: var(--lime);
}

.section-num {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  font-weight: 500;
  color: var(--ink-4);
  letter-spacing: 0.08em;
  padding-bottom: 4px;
}

.section-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}

/* ═══════════════════════════════════════════════════════════════
   STATS — big numbers, editorial style
   ═══════════════════════════════════════════════════════════════ */

.stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 1px;
  background: var(--rule);
  border: var(--rule-w) solid var(--rule);
  border-radius: var(--radius-lg);
  overflow: hidden;
}

.stat {
  background: var(--panel);
  padding: 24px 26px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  position: relative;
  transition: background 0.3s var(--ease);
}

.stat:hover { background: var(--panel-2); }

.stat-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ink-3);
  display: flex;
  align-items: center;
  gap: 6px;
}

.stat-label::before {
  content: '';
  width: 5px;
  height: 5px;
  background: var(--lime);
  border-radius: 1px;
}

.stat:nth-child(2) .stat-label::before { background: var(--ink-3); }
.stat:nth-child(3) .stat-label::before { background: var(--cancel); }

.stat-value {
  font-family: 'Instrument Serif', serif;
  font-size: 56px;
  font-weight: 400;
  line-height: 0.95;
  letter-spacing: -0.035em;
  font-variant-numeric: tabular-nums;
  color: var(--ink);
}

.stat:nth-child(1) .stat-value { color: var(--lime); }
.stat:nth-child(3) .stat-value { color: var(--cancel); }

/* ═══════════════════════════════════════════════════════════════
   SCHEDULE — timeline style, not cards
   ═══════════════════════════════════════════════════════════════ */

.week {
  border-bottom: var(--rule-w) solid var(--rule);
}

.week:last-child { border-bottom: 0; }

.week-head {
  display: grid;
  grid-template-columns: 80px 1fr auto;
  align-items: center;
  gap: 20px;
  padding: 18px 4px;
  cursor: pointer;
  user-select: none;
  transition: all 0.25s var(--ease);
  position: relative;
}

.week-head::before {
  content: '';
  position: absolute;
  left: 40px;
  top: 50%;
  transform: translate(-50%, -50%);
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--lime);
  opacity: 0;
  transition: opacity 0.3s;
}

.week-head:hover::before { opacity: 1; }

.week-head:hover { padding-left: 12px; }

.week-num {
  font-family: 'Instrument Serif', serif;
  font-size: 40px;
  font-weight: 400;
  line-height: 1;
  color: var(--ink-4);
  transition: color 0.25s var(--ease);
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.02em;
}

.week-head:hover .week-num { color: var(--lime); }

.week-meta { display: flex; flex-direction: column; gap: 4px; }

.week-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ink-4);
}

.week-desc {
  font-size: 14px;
  font-weight: 500;
  color: var(--ink-2);
  display: flex;
  gap: 16px;
  flex-wrap: wrap;
}

.week-desc span {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.week-desc .pip {
  width: 6px;
  height: 6px;
  border-radius: 50%;
}

.week-desc .p { background: var(--present); }
.week-desc .a { background: var(--absent); }
.week-desc .c { background: var(--cancel); }

.week-open {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  border: var(--rule-w) solid var(--rule-2);
  background: transparent;
  color: var(--ink-3);
  display: grid;
  place-items: center;
  transition: all 0.3s var(--ease-spring);
  font-family: inherit;
  font-size: 14px;
}

.week.open .week-open {
  transform: rotate(45deg);
  background: var(--lime);
  color: var(--bg);
  border-color: var(--lime);
}

.week-body {
  display: grid;
  grid-template-rows: 0fr;
  transition: grid-template-rows 0.4s var(--ease);
}

.week-body > div { overflow: hidden; }

.week.open .week-body { grid-template-rows: 1fr; }

/* ═══════════════════════════════════════════════════════════════
   CLASS ROWS — list-based, editorial
   ═══════════════════════════════════════════════════════════════ */

.classes {
  display: flex;
  flex-direction: column;
  padding-left: 40px;
  padding-bottom: 12px;
  position: relative;
}

.classes::before {
  content: '';
  position: absolute;
  left: 40px;
  top: 0;
  bottom: 0;
  width: 1px;
  background: var(--rule-2);
}

.cls {
  display: grid;
  grid-template-columns: 140px 1fr auto auto;
  align-items: center;
  gap: 20px;
  padding: 16px 8px 16px 28px;
  position: relative;
  transition: all 0.25s var(--ease);
  border-bottom: var(--rule-w) solid var(--rule);
}

.cls:last-child { border-bottom: 0; }

.cls::before {
  content: '';
  position: absolute;
  left: 40px;
  top: 50%;
  transform: translate(-50%, -50%);
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--rule-3);
  border: 2px solid var(--bg);
  transition: all 0.3s var(--ease);
}

.cls:hover::before {
  background: var(--lime);
  transform: translate(-50%, -50%) scale(1.4);
}

.cls.is-cancelled::before { background: var(--cancel); }
.cls.is-present::before { background: var(--present); }
.cls.is-absent::before { background: var(--absent); }

.cls:hover {
  background: var(--panel);
  padding-left: 32px;
  border-radius: var(--radius);
}

.cls-date {
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  font-weight: 500;
  color: var(--ink-2);
  letter-spacing: 0.02em;
  display: flex;
  flex-direction: column;
  gap: 3px;
}

.cls-date .dow {
  font-size: 10px;
  color: var(--ink-4);
  letter-spacing: 0.1em;
  text-transform: uppercase;
}

.cls-subject {
  font-family: 'Instrument Serif', serif;
  font-size: 22px;
  font-weight: 400;
  letter-spacing: -0.015em;
  color: var(--ink);
  line-height: 1.15;
  word-break: break-word;
}

.cls.is-cancelled .cls-subject {
  text-decoration: line-through;
  text-decoration-thickness: 1.5px;
  text-decoration-color: var(--ink-4);
  color: var(--ink-3);
}

.cls-tag {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  padding: 4px 9px;
  border-radius: 4px;
  border: var(--rule-w) solid;
  white-space: nowrap;
}

.cls-tag.present {
  color: var(--present);
  background: var(--present-b);
  border-color: var(--present);
}

.cls-tag.absent {
  color: var(--absent);
  background: var(--absent-b);
  border-color: var(--absent);
}

.cls-tag.cancelled {
  color: var(--cancel);
  background: var(--cancel-b);
  border-color: var(--cancel);
}

.cls-tag.unmarked {
  color: var(--ink-3);
  background: var(--neutral-b);
  border-color: var(--rule-2);
}

.cls-actions {
  display: flex;
  gap: 6px;
  opacity: 0;
  transition: opacity 0.25s var(--ease);
}

.cls:hover .cls-actions { opacity: 1; }

@media (hover: none) {
  .cls-actions { opacity: 1; }
}

.cls-btn {
  padding: 7px 12px;
  border: var(--rule-w) solid var(--rule-2);
  background: var(--panel);
  color: var(--ink-2);
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  cursor: pointer;
  border-radius: 6px;
  transition: all 0.2s var(--ease);
  white-space: nowrap;
}

.cls-btn:hover:not(:disabled) { transform: translateY(-1px); }
.cls-btn:disabled { opacity: 0.4; cursor: not-allowed; }

.cls-btn.p { border-color: var(--present); color: var(--present); }
.cls-btn.p:hover:not(:disabled) { background: var(--present); color: var(--bg); }

.cls-btn.a { border-color: var(--absent); color: var(--absent); }
.cls-btn.a:hover:not(:disabled) { background: var(--absent); color: var(--bg); }

.cls-btn.c { border-color: var(--cancel); color: var(--cancel); }
.cls-btn.c:hover:not(:disabled) { background: var(--cancel); color: var(--bg); }

.cls-btn.u { border-color: var(--lime); color: var(--lime); }
.cls-btn.u:hover:not(:disabled) { background: var(--lime); color: var(--bg); }

.cls-btn.d:hover:not(:disabled) { background: var(--absent); color: var(--bg); border-color: var(--absent); }

/* view mode hides edit actions */
.mode-view .cls-actions { display: none; }
.mode-view .add-panel { display: none; }

/* ═══════════════════════════════════════════════════════════════
   SIDE PANEL — add form, compact
   ═══════════════════════════════════════════════════════════════ */

.add-panel {
  border: var(--rule-w) solid var(--rule-2);
  border-radius: var(--radius-xl);
  background: var(--panel);
  padding: 24px;
  position: relative;
  overflow: hidden;
}

.add-panel::before {
  content: '';
  position: absolute;
  top: -80px;
  right: -80px;
  width: 200px;
  height: 200px;
  background: radial-gradient(circle, var(--lime-glow), transparent 70%);
  pointer-events: none;
  opacity: 0.5;
}

.add-header {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  margin-bottom: 20px;
  position: relative;
}

.add-header h3 {
  font-family: 'Instrument Serif', serif;
  font-size: 26px;
  font-weight: 400;
  letter-spacing: -0.02em;
  line-height: 1;
}

.add-header h3 em { font-style: italic; color: var(--lime); }

.add-header .idx {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.14em;
  color: var(--ink-4);
  padding: 4px 8px;
  border: var(--rule-w) solid var(--rule-2);
  border-radius: 4px;
}

.add-fields {
  display: flex;
  flex-direction: column;
  gap: 14px;
  position: relative;
}

.field { display: flex; flex-direction: column; gap: 6px; }

.field label {

  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.14em;

}

.input {

  height: 48px;
  border: var(--rule-w) solid var(--rule-2);
  border-radius: var(--radius);
  background: var(--bg-2);
  padding: 0 14px;
  font-family: inherit;
  font-size: 14px;
  font-weight: 500;

.input:focus {

}

.input::placeholder { color: var(--ink-4); font-weight: 400; }

.subject-wrap { position: relative; }
.subject-wrap .input { padding-right: 44px; }

.subject-arrow {
  position: absolute;
  top: 50%;
  right: 6px;
  transform: translateY(-50%);
  width: 34px;
  height: 34px;
  border: 0;
  background: transparent;
  color: var(--ink-3);
  border-radius: 8px;
  cursor: pointer;
  display: grid;
  place-items: center;

  font-family: inherit;
  font-size: 15px;
}

.subject-arrow:hover { background: var(--panel-3); color: var(--lime); }

.suggest {

  right: 0;

  padding: 6px;
  z-index: 60;

}

.suggest.show { display: block; animation: dropIn 0.2s var(--ease); }

@keyframes dropIn {
  from { opacity: 0; transform: translateY(-6px); }
  to { opacity: 1; transform: translateY(0); }
}

.sug-item {
  display: flex;
  align-items: center;

  background: transparent;
  border-radius: 8px;
  font-family: inherit;
  font-size: 14px;
  font-weight: 500;
  color: var(--ink);

}

.sug-item:hover { background: var(--panel-2); color: var(--lime); }

.sug-item .em {

  height: 28px;

  flex-shrink: 0;
}

.sug-item .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.sug-item .ed {
  width: 24px;
  height: 24px;
  border: 0;
  background: transparent;
  color: var(--ink-3);
  border-radius: 6px;
  cursor: pointer;
  opacity: 0;
  transition: opacity 0.15s;
  font-family: inherit;
}

.sug-item:hover .ed { opacity: 1; }
.sug-item .ed:hover { background: var(--panel-3); color: var(--lime); }

.sug-empty {
  padding: 14px;
  text-align: center;
  color: var(--ink-4);
  font-size: 12px;
  font-family: 'JetBrains Mono', monospace;
}

.btn-primary {
  height: 48px;
  width: 100%;
  border: 0;

  color: var(--bg);

  font-size: 14px;
  font-weight: 700;

  justify-content: center;
  gap: 8px;
  margin-top: 4px;
  position: relative;
  overflow: hidden;
}

.btn-primary::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.25), transparent);
  transform: translateX(-100%);

}

.btn-primary:hover:not(:disabled) {

}

.btn-primary:hover:not(:disabled)::after { transform: translateX(100%); }

.btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

.add-footer {
  display: flex;
  gap: 6px;
  margin-top: 16px;
  padding-top: 16px;
  border-top: var(--rule-w) solid var(--rule);
  position: relative;
}

.btn-text {
  flex: 1;
  padding: 9px 12px;
  border: var(--rule-w) solid var(--rule-2);
  background: transparent;
  color: var(--ink-2);
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;

  border-radius: 6px;

  white-space: nowrap;
}

.btn-text:hover {
  background: var(--panel-2);
  border-color: var(--lime);
  color: var(--lime);
}

.btn-text.danger:hover {
  background: var(--absent-b);

  color: var(--absent);
}

.flash {
  margin-top: 14px;
  padding: 12px 16px;
  border-radius: var(--radius);

  font-weight: 600;
  font-family: 'JetBrains Mono', monospace;

}

.flash.success { display: block; background: var(--present-b); color: var(--present); }
.flash.error { display: block; background: var(--absent-b); color: var(--absent); }
.flash.info { display: block; background: var(--neutral-b); color: var(--ink-2); }

/* ═══════════════════════════════════════════════════════════════
   SUBJECT PANEL
   ═══════════════════════════════════════════════════════════════ */

.subject-list {

  flex-direction: column;

.subj-nm {

.subj-metrics {

  gap: 16px;
}

.subj-track {
  width: 120px;
  height: 4px;

  border-radius: 999px;
  overflow: hidden;
  position: relative;
}

.subj-fill {

.subj-fill.low { background: var(--absent); }

.subj-pct {

}

.subj.open .subj-op { transform: rotate(180deg); color: var(--lime); }

.subj-body {

  grid-template-rows: 0fr;

}

.subj-body > div { overflow: hidden; }

.subj-rows {

  gap: 2px;
}

.subj-row {

  grid-template-columns: 110px 1fr auto;
  align-items: center;
  gap: 14px;
  padding: 9px 12px;

}

.subj-row:hover { background: var(--panel-2); }

.subj-row-date {

  font-size: 11px;
  font-weight: 500;
  color: var(--ink-2);
  letter-spacing: 0.02em;
}

.subj-row-dow {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  color: var(--ink-4);

}

.subj-row-tag {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.08em;

}

.subj-row-tag.present { color: var(--present); border-color: var(--present); background: var(--present-b); }
.subj-row-tag.absent { color: var(--absent); border-color: var(--absent); background: var(--absent-b); }
.subj-row-tag.cancelled { color: var(--cancel); border-color: var(--cancel); background: var(--cancel-b); }
.subj-row-tag.unmarked { color: var(--ink-3); border-color: var(--rule-2); }

/* ═══════════════════════════════════════════════════════════════
   EMPTY / LOADING
   ═══════════════════════════════════════════════════════════════ */

.empty {
  text-align: center;
  padding: 56px 24px;
  border: var(--rule-w) dashed var(--rule-2);
  border-radius: var(--radius-lg);
  background: var(--panel);
}

.empty-icon {
  font-size: 40px;

  margin-bottom: 16px;
  opacity: 0.4;
}

.empty-title {

  font-weight: 400;

}

.empty-desc {
  font-size: 13px;
  color: var(--ink-3);
  margin-bottom: 20px;
}

.skeleton {
  height: 64px;
  background: var(--panel);
  border: var(--rule-w) solid var(--rule);
  border-radius: var(--radius);
  position: relative;
  overflow: hidden;
}

.skeleton::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.04), transparent);
  animation: shimmer 1.8s infinite;
}

@keyframes shimmer {
  from { transform: translateX(-100%); }
  to { transform: translateX(100%); }
}

.skel-stack { display: flex; flex-direction: column; gap: 8px; }

/* ═══════════════════════════════════════════════════════════════
   EMOJI GRID
   ═══════════════════════════════════════════════════════════════ */

.emoji-grid {
  display: grid;
  grid-template-columns: repeat(8, 1fr);

  padding: 8px;

}

.emoji-btn {
  width: 34px;
  height: 34px;
  border: 0;
  background: transparent;
  border-radius: 8px;
  font-size: 18px;
  cursor: pointer;

  place-items: center;
}

.emoji-btn:hover { background: var(--panel-3); transform: scale(1.15); }
.emoji-btn.active { background: var(--lime); }

.emoji-title {
  padding: 10px 12px 4px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ink-3);
}

/* ═══════════════════════════════════════════════════════════════
   CONFETTI
   ═══════════════════════════════════════════════════════════════ */

.confetti {
  position: fixed;
  width: 8px;
  height: 8px;
  pointer-events: none;
  z-index: 9999;
  animation: fall 2s cubic-bezier(0.2, 0.6, 0.4, 1) forwards;
}

@keyframes fall {
  0% { transform: translateY(0) rotate(0); opacity: 1; }
  100% { transform: translateY(100vh) rotate(900deg); opacity: 0; }
}

/* ═══════════════════════════════════════════════════════════════
   SCROLLBAR
   ═══════════════════════════════════════════════════════════════ */

::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: transparent; }

  background: var(--rule-2);

  border: 3px solid var(--bg);
}
::-webkit-scrollbar-thumb:hover { background: var(--rule-3); }

<div class="wrap">

  <!-- MASTHEAD -->
  <header class="masthead">
    <div class="masthead-brand">
      <h1 class="masthead-title">Presence <em>/</em></h1>
      <span class="masthead-tag">attendance · studio</span>
    </div>
    <div class="masthead-controls">
      <div class="mode-toggle" id="modeToggle">

          <path d="M21 12a9 9 0 1 1-3-6.7L21 8"/>

  <div class="dashboard">

    <!-- MAIN COLUMN -->

      <!-- STATS -->

          <div class="stat-label">Weeks tracked</div>
          <div class="stat-value" id="weekCount" data-count="0">0</div>

          <div class="stat-label">Total classes</div>

  </div>

</div>

/* ══════════════════════════════════════════════════════════════

const API_URL = "https://script.google.com/macros/s/AKfycbxryV1UhZClPxP8m95HerdLGEZOV_T1Gp-YLy7-2KUBn_6H__LlMP-KgCzzoVB91aZIcA/exec";

let classes = [];
let mode = localStorage.getItem("presence_mode") || "view";

/* ══════════════════════════════════════════════════════════════
   SYNC LOCK
   ══════════════════════════════════════════════════════════════ */
function lockSync() {
  syncLocks++;
  if (syncLocks === 1) {
    syncingSince = Date.now();
    lastQ = queue.length;
    setStatus("syncing");
  }
}
function unlockSync() {
  syncLocks = Math.max(0, syncLocks - 1);
  if (syncLocks === 0) { syncingSince = 0; updateOnline(); }
}

setInterval(() => {
  if (syncLocks > 0 && syncingSince > 0) {
    const el = Date.now() - syncingSince;
    if (el > 20000 && queue.length === lastQ) {
      syncLocks = 0; syncingSince = 0; updateOnline();
    } else if (queue.length !== lastQ) {
      syncingSince = Date.now(); lastQ = queue.length;
    }
  }
}, 3000);

/* ══════════════════════════════════════════════════════════════
   STATUS
   ══════════════════════════════════════════════════════════════ */
const cloudStatus = document.getElementById("cloudStatus");
const cloudText = document.getElementById("cloudText");
const pendingBadge = document.getElementById("pendingBadge");
const offlineBanner = document.getElementById("offlineBanner");
const queueBanner = document.getElementById("queueBanner");
const queueText = document.getElementById("queueText");

function setStatus(s) {
  cloudStatus.classList.remove("synced", "syncing", "offline");
  cloudStatus.classList.add(s);
  if (s === "syncing") {
    cloudText.textContent = "syncing…";
  } else if (s === "offline") {
    cloudText.textContent = navigator.onLine ? "retrying…" : "offline";
  } else {
    if (lastSync) {
      const sec = Math.floor((Date.now() - lastSync) / 1000);
      let label = "now";
      if (sec >= 60) label = Math.floor(sec / 60) + "m";
      else if (sec > 5) label = sec + "s";
      cloudText.textContent = "synced · " + label;
    } else {
      cloudText.textContent = "synced";
    }
  }
}

function updatePending() {
  if (queue.length > 0) {
    pendingBadge.style.display = "inline-block";
    pendingBadge.textContent = queue.length;
    queueBanner.classList.add("show");
    queueText.textContent = "// " + queue.length + " change" + (queue.length !== 1 ? "s" : "") + " queued";
  } else {
    pendingBadge.style.display = "none";
    queueBanner.classList.remove("show");
  }
}

function updateOnline() {
  if (!navigator.onLine) {
    setStatus("offline");
    offlineBanner.classList.add("show");
  } else {
    offlineBanner.classList.remove("show");
    if (syncLocks === 0) setStatus("synced");
  }
}

window.addEventListener("online", () => {
  updateOnline();
  if (queue.length > 0) flushQueue();
  else loadData(true);
});

window.addEventListener("offline", updateOnline);
updateOnline();

setInterval(() => {
  if (syncLocks === 0 && navigator.onLine && lastSync) setStatus("synced");
}, 30000);

/* ══════════════════════════════════════════════════════════════
   QUEUE
   ══════════════════════════════════════════════════════════════ */
function loadQueue() {
  try {
    const raw = localStorage.getItem(QUEUE_KEY);
    return raw ? JSON.parse(raw) : [];
  } catch { return []; }
}
function saveQueue() {
  try { localStorage.setItem(QUEUE_KEY, JSON.stringify(queue)); } catch {}
  updatePending();
}
function enqueue(p) {
  if (p.action === "update") {
    const i = queue.findIndex(q => q.action === "update" && q.id === p.id);
    if (i >= 0) queue[i] = p; else queue.push(p);
  } else if (p.action === "delete") {
    queue = queue.filter(q => q.id !== p.id);
    queue.push(p);
  } else if (p.action === "add") {
    const i = queue.findIndex(q => q.action === "add" && q.id === p.id);
    if (i >= 0) queue[i] = p; else queue.push(p);
  } else {
    queue.push(p);
  }
  saveQueue();
}

async function flushQueue() {
  if (syncLocks > 0 && syncingSince > 0 && Date.now() - syncingSince < 1000) return;
  if (queue.length === 0 || !navigator.onLine) return;

  lockSync();
  const total = queue.length;
  let ok = 0;
  try {
    while (queue.length > 0 && navigator.onLine) {
      const p = queue[0];
      try {
        await sendToSheet(p);
        queue.shift();
        saveQueue();
        ok++;
        if (queue.length > 0) queueText.textContent = "// syncing " + ok + " of " + total;
      } catch (e) {
        break;
      }
    }
  } finally {
    unlockSync();
  }

  if (ok > 0) {
    lastSync = Date.now();
    if (queue.length === 0) {
      showMsg("synced " + ok + " change" + (ok !== 1 ? "s" : ""), "success");
      const reload = ok >= 5 || (Date.now() - lastFlush > 30000);
      lastFlush = Date.now();
      if (reload) await loadData(true);
    } else {
      updateOnline();
    }
  }
  updatePending();
}

document.getElementById("flushQueueBtn").addEventListener("click", flushQueue);

/* ══════════════════════════════════════════════════════════════
   DATE
   ══════════════════════════════════════════════════════════════ */
function getDay(d) {
  return new Date(d + "T00:00:00").toLocaleDateString("en-US", { weekday: "long" });
}
function fmtDate(d) {
  return new Date(d + "T00:00:00").toLocaleDateString("en-GB", {
    weekday: "short", day: "2-digit", month: "short"
  });
}
function fmtShort(d) {
  return new Date(d + "T00:00:00").toLocaleDateString("en-GB", {
    day: "2-digit", month: "short"
  });
}
function fmtDow(d) {
  return new Date(d + "T00:00:00").toLocaleDateString("en-US", { weekday: "short" });
}
function getWeek(d) {
  const start = new Date("2026-09-07T00:00:00");
  const cur = new Date(d + "T00:00:00");
  const diff = Math.floor((cur - start) / 86400000);
  if (diff < 0) return 0;
  return Math.floor(diff / 7) + 1;
}

/* ══════════════════════════════════════════════════════════════
   STATUS HELPERS
   ══════════════════════════════════════════════════════════════ */
function isCancelled(i) {
  if (typeof i.cancelled === "boolean") return i.cancelled;
  return i.status === "CANCELLED";
}

function statusOf(i) {
  if (isCancelled(i)) return "cancelled";
  if (i.attendance === "PRESENT") return "present";
  if (i.attendance === "ABSENT") return "absent";
  return "unmarked";
}

function tagHTML(i, cls = "cls-tag") {
  const s = statusOf(i);
  const labels = { present: "Present", absent: "Absent", cancelled: "Cancelled", unmarked: "Unmarked" };
  return `<span class="${cls} ${s}">${labels[s]}</span>`;
}

/* ══════════════════════════════════════════════════════════════
   API
   ══════════════════════════════════════════════════════════════ */
async function loadData(silent = false) {
  if (!navigator.onLine) { setStatus("offline"); return; }
  if (loading) return;
  loading = true;
  if (!silent) lockSync();
  try {
    const res = await fetchTO(API_URL + "?t=" + Date.now(), { method: "GET" }, REQ_TIMEOUT);
    const data = await res.json();
    classes = Array.isArray(data) ? data : [];
    lastSync = Date.now();
    if (!silent) unlockSync();
    updateOnline();
    render();
  } catch (e) {
    console.error(e);
    if (!silent) unlockSync();
    setStatus("offline");
    if (!silent) showMsg("couldn't reach sheets", "error");
  } finally {
    loading = false;
  }
}

async function fetchTO(url, opts = {}, ms) {
  const c = new AbortController();
  const t = setTimeout(() => c.abort(), ms);
  try {
    return await fetch(url, { ...opts, signal: c.signal });
  } finally {
    clearTimeout(t);
  }
}

async function sendToSheet(p) {
  await fetchTO(API_URL, { method: "POST", mode: "no-cors", body: JSON.stringify(p) }, REQ_TIMEOUT);
}

/* ══════════════════════════════════════════════════════════════
   ADD
   ══════════════════════════════════════════════════════════════ */
async function addClass() {
  if (mode !== "edit") return;

  const dateEl = document.getElementById("date");
  const subjEl = document.getElementById("subject");
  const date = dateEl.value;
  const subj = subjEl.value.trim();

  if (!date) { showMsg("pick a date", "error"); return; }
  if (!subj) { showMsg("add a subject", "error"); return; }

  const dup = classes.some(i => i.date === date && i.subject.toLowerCase() === subj.toLowerCase());
  if (dup) { showMsg("already exists", "error"); return; }

  const item = {
    id: Date.now().toString() + Math.random().toString(36).slice(2, 7),
    date, day: getDay(date), subject: subj, cancelled: false, attendance: ""
  };

  const btn = document.getElementById("addBtn");
  btn.disabled = true;
  btn.querySelector("span").textContent = "saving…";

  classes.push(item);
  render();
  dateEl.value = "";
  subjEl.value = "";
  if (navigator.vibrate) navigator.vibrate(8);

  const p = { action: "add", ...item };

  if (!navigator.onLine) {
    enqueue(p);
    showMsg("offline — queued", "info");
    btn.disabled = false; btn.querySelector("span").textContent = "Add class";
    updateOnline();
    return;
  }

  lockSync();
  try {
    await sendToSheet(p);
    lastSync = Date.now();
    showMsg("class added", "success");
  } catch (e) {
    enqueue(p);
    showMsg("saved locally", "info");
  } finally {
    unlockSync();
    btn.disabled = false;
    btn.querySelector("span").textContent = "Add class";
  }
}

/* ══════════════════════════════════════════════════════════════
   MARK
   ══════════════════════════════════════════════════════════════ */
async function mark(id, attendance, btn) {
  const item = classes.find(x => x.id === id);
  if (!item || isCancelled(item)) return;

  if (navigator.vibrate) navigator.vibrate(6);
  if (btn) { btn.disabled = true; btn.textContent = "…"; }

  item.attendance = attendance;
  render();

  const p = { action: "update", id, attendance };

  if (!navigator.onLine) { enqueue(p); updateOnline(); return; }

  lockSync();
  try {
    await sendToSheet(p);
    lastSync = Date.now();
    checkPerfect(item.subject);
  } catch (e) {
    enqueue(p);
  } finally {
    unlockSync();
  }
}

/* ══════════════════════════════════════════════════════════════
   TOGGLE CANCELLED
   ══════════════════════════════════════════════════════════════ */
async function toggleCancel(id, btn) {
  const item = classes.find(x => x.id === id);
  if (!item) return;

  if (navigator.vibrate) navigator.vibrate(6);

  const newVal = !isCancelled(item);
  item.cancelled = newVal;
  item.attendance = "";

  render();

  const p = { action: "update", id, cancelled: newVal, attendance: "" };

  if (!navigator.onLine) {
    enqueue(p); updateOnline();
    showMsg(newVal ? "cancelled (offline)" : "restored (offline)", "info");
    return;
  }

  lockSync();
  try {
    await sendToSheet(p);
    lastSync = Date.now();
    showMsg(newVal ? "marked cancelled" : "marked as class", "success");
  } catch (e) {
    enqueue(p);
  } finally {
    unlockSync();
  }
}

/* ══════════════════════════════════════════════════════════════
   PERFECT
   ══════════════════════════════════════════════════════════════ */
function checkPerfect(subj) {
  const items = classes.filter(c => c.subject === subj && !isCancelled(c));
  if (items.length < 5) return;
  const marked = items.filter(c => c.attendance);
  if (marked.length !== items.length) return;
  if (items.every(c => c.attendance === "PRESENT")) confetti();
}

function confetti() {
  const colors = ["#d4ff4d", "#4ade80", "#fbbf24", "#f87171", "#a78bfa"];
  for (let i = 0; i < 50; i++) {
    const p = document.createElement("div");
    p.className = "confetti";
    p.style.left = Math.random() * 100 + "vw";
    p.style.top = "-20px";
    p.style.background = colors[Math.floor(Math.random() * colors.length)];
    p.style.animationDelay = Math.random() * 0.4 + "s";
    p.style.animationDuration = (1.4 + Math.random() * 1) + "s";
    document.body.appendChild(p);
    setTimeout(() => p.remove(), 2800);
  }
}

/* ══════════════════════════════════════════════════════════════
   DELETE
   ══════════════════════════════════════════════════════════════ */
async function del(id) {
  const item = classes.find(x => x.id === id);
  if (!item) return;
  if (!confirm("Delete " + item.subject + " on " + fmtDate(item.date) + "?")) return;
  if (navigator.vibrate) navigator.vibrate([10, 30, 10]);

  classes = classes.filter(x => x.id !== id);
  render();

  const p = { action: "delete", id };

  if (!navigator.onLine) { enqueue(p); updateOnline(); return; }

  lockSync();
  try {
    await sendToSheet(p);
    lastSync = Date.now();
    showMsg("deleted", "success");
  } catch (e) {
    enqueue(p);
    showMsg("deleted locally", "info");
  } finally {
    unlockSync();
  }
}

/* ══════════════════════════════════════════════════════════════
   RESET
   ══════════════════════════════════════════════════════════════ */
async function resetAll() {
  if (!classes.length) { showMsg("nothing to reset", "error"); return; }
  const a = prompt("Delete ALL " + classes.length + " records.\n\nType DELETE to confirm:");
  if (a !== "DELETE") { if (a !== null) showMsg("cancelled", "info"); return; }

  classes = []; queue = []; saveQueue(); render();

  const p = { action: "reset" };
  if (!navigator.onLine) { enqueue(p); showMsg("offline — queued", "info"); return; }

  lockSync();
  try {
    await sendToSheet(p);
    lastSync = Date.now();
    showMsg("all records deleted", "success");
  } catch (e) {
    enqueue(p);
    showMsg("queued", "info");
  } finally { unlockSync(); }
}

/* ══════════════════════════════════════════════════════════════
   CSV
   ══════════════════════════════════════════════════════════════ */
function exportCSV() {
  if (!classes.length) { showMsg("no data", "error"); return; }
  const headers = ["id", "date", "day", "subject", "cancelled", "attendance"];
  const rows = [headers.join(",")];
  [...classes].sort((a, b) => a.date.localeCompare(b.date)).forEach(it => {
    const n = {
      id: it.id, date: it.date, day: it.day, subject: it.subject,
      cancelled: isCancelled(it) ? "TRUE" : "FALSE",
      attendance: it.attendance || ""
    };
    const row = headers.map(h => {
      const v = String(n[h] ?? "");
      return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
    });
    rows.push(row.join(","));
  });
  const blob = new Blob([rows.join("\n")], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "presence-" + new Date().toISOString().slice(0, 10) + ".csv";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showMsg("exported " + classes.length + " records", "success");
}

/* ══════════════════════════════════════════════════════════════
   COUNT ANIM
   ══════════════════════════════════════════════════════════════ */
function animCount(el, target) {
  if (!el) return;
  const cur = parseInt(el.getAttribute("data-count") || "0", 10);
  if (cur === target) { el.textContent = target; return; }
  el.setAttribute("data-count", target);
  const start = performance.now();
  const dur = 700;
  const from = cur;
  function step(now) {
    const t = Math.min(1, (now - start) / dur);
    const e = 1 - Math.pow(1 - t, 4);
    el.textContent = Math.round(from + (target - from) * e);
    if (t < 1) requestAnimationFrame(step);
    else el.textContent = target;
  }
  requestAnimationFrame(step);
}

/* ══════════════════════════════════════════════════════════════
   RENDER: OVERVIEW
   ══════════════════════════════════════════════════════════════ */
function renderOverview() {
  const weeks = new Set(classes.map(i => getWeek(i.date)));
  const total = classes.length;
  const cancelled = classes.filter(i => isCancelled(i)).length;

  animCount(document.getElementById("weekCount"), weeks.size);
  animCount(document.getElementById("totalCount"), total);
  animCount(document.getElementById("cancelledCount"), cancelled);
}

/* ══════════════════════════════════════════════════════════════
   RENDER: SCHEDULE
   ══════════════════════════════════════════════════════════════ */
function renderSchedule() {
  const c = document.getElementById("schedule");
  c.innerHTML = "";

  if (!classes.length) {
    c.innerHTML = `
      <div class="empty">
        <span class="empty-icon">◌</span>
        <div class="empty-title">No classes yet</div>
        <div class="empty-desc">${mode === "view" ? "Switch to Edit mode to add your first class." : "Add your first class using the panel."}</div>
        ${mode === "view" ? '<button class="btn-text" onclick="document.getElementById(\'modeEditBtn\').click()" style="flex:0;padding:10px 20px;">switch to edit</button>' : ''}
      </div>
    `;
    return;
  }

  const sorted = [...classes].sort((a, b) => a.date.localeCompare(b.date));
  const weeks = {};
  sorted.forEach(i => {
    const w = getWeek(i.date);
    if (!weeks[w]) weeks[w] = [];
    weeks[w].push(i);
  });

  const openWeeks = new Set(
    [...c.querySelectorAll(".week.open")].map(el => el.getAttribute("data-week"))
  );

  // auto-open the latest week if nothing is open
  const allWeeks = Object.keys(weeks).sort((a, b) => +a - +b);
  const autoOpen = allWeeks.length ? allWeeks[allWeeks.length - 1] : null;

  allWeeks.forEach(week => {
    const wb = document.createElement("div");
    const isOpen = openWeeks.has(week) || (openWeeks.size === 0 && week === autoOpen);
    wb.className = "week" + (isOpen ? " open" : "");
    wb.setAttribute("data-week", week);

    const items = weeks[week];
    const pC = items.filter(i => !isCancelled(i) && i.attendance === "PRESENT").length;
    const aC = items.filter(i => !isCancelled(i) && i.attendance === "ABSENT").length;
    const cC = items.filter(i => isCancelled(i)).length;

    const desc = [];
    if (pC) desc.push(`<span><span class="pip p"></span>${pC} present</span>`);
    if (aC) desc.push(`<span><span class="pip a"></span>${aC} absent</span>`);
    if (cC) desc.push(`<span><span class="pip c"></span>${cC} cancelled</span>`);
    if (!desc.length) desc.push(`<span>${items.length} class${items.length !== 1 ? "es" : ""}</span>`);

    const head = document.createElement("div");
    head.className = "week-head";
    head.innerHTML = `
      <div class="week-num">${week}</div>
      <div class="week-meta">
        <div class="week-label">Week ${week}</div>
        <div class="week-desc">${desc.join("")}</div>
      </div>
      <div class="week-open">+</div>
    `;
    head.addEventListener("click", () => wb.classList.toggle("open"));
    wb.appendChild(head);

    const body = document.createElement("div");
    body.className = "week-body";
    const inner = document.createElement("div");

    const list = document.createElement("div");
    list.className = "classes";

    items.forEach(item => {
      const s = statusOf(item);
      const row = document.createElement("div");
      row.className = "cls is-" + s;

      let actions = '';
      if (mode === "edit") {
        if (s === "cancelled") {
          actions = `
            <button class="cls-btn u" data-a="unmark" data-id="${item.id}">restore</button>
            <button class="cls-btn d" data-a="delete" data-id="${item.id}">delete</button>
          `;
        } else {
          actions = `
            <button class="cls-btn p" data-a="present" data-id="${item.id}">present</button>
            <button class="cls-btn a" data-a="absent" data-id="${item.id}">absent</button>
            <button class="cls-btn c" data-a="cancel" data-id="${item.id}">cancel</button>
            <button class="cls-btn d" data-a="delete" data-id="${item.id}">delete</button>
          `;
        }
      }

      row.innerHTML = `
        <div class="cls-date">
          <span>${fmtShort(item.date)}</span>
          <span class="dow">${fmtDow(item.date)}</span>
        </div>
        <div class="cls-subject">${escapeHTML(item.subject)}</div>
        ${tagHTML(item)}
        <div class="cls-actions">${actions}</div>
      `;

      if (mode === "edit") {
        row.querySelectorAll(".cls-btn").forEach(b => {
          b.addEventListener("click", e => {
            e.stopPropagation();
            const a = b.getAttribute("data-a");
            const id = b.getAttribute("data-id");
            if (a === "present") mark(id, "PRESENT", b);
            else if (a === "absent") mark(id, "ABSENT", b);
            else if (a === "cancel" || a === "unmark") toggleCancel(id, b);
            else if (a === "delete") del(id);
          });
        });
      }

      list.appendChild(row);
    });

    inner.appendChild(list);
    body.appendChild(inner);
    wb.appendChild(body);
    c.appendChild(wb);
  });
}

/* ══════════════════════════════════════════════════════════════
   RENDER: SUBJECTS
   ══════════════════════════════════════════════════════════════ */
function renderSubjects() {
  const c = document.getElementById("subjectStats");
  c.innerHTML = "";

  const bySubj = {};
  classes.forEach(i => {
    if (!bySubj[i.subject]) bySubj[i.subject] = [];
    bySubj[i.subject].push(i);
  });

  const names = Object.keys(bySubj).sort();
  if (!names.length) {
    c.innerHTML = `
      <div class="empty">
        <span class="empty-icon">◌</span>
        <div class="empty-title">No subjects</div>
        <div class="empty-desc">Subjects appear here once you add classes.</div>
      </div>
    `;
    return;
  }

  names.forEach(subject => {
    const items = bySubj[subject];
    const active = items.filter(x => !isCancelled(x));
    const p = active.filter(x => x.attendance === "PRESENT").length;
    const a = active.filter(x => x.attendance === "ABSENT").length;
    const tot = p + a;
    const pct = tot ? Math.round((p / tot) * 100) : 0;
    const low = pct < 75 && tot > 0;

    const sorted = [...items].sort((x, y) => y.date.localeCompare(x.date));
    const rows = sorted.map(x => `
      <div class="subj-row">
        <div>
          <div class="subj-row-date">${fmtShort(x.date)}</div>
          <div class="subj-row-dow">${x.day}</div>
        </div>
        <div></div>
        ${tagHTML(x, "subj-row-tag")}
      </div>
    `).join("");

    const isOpen = expanded.has(subject);
    const block = document.createElement("div");
    block.className = "subj" + (isOpen ? " open" : "");
    block.innerHTML = `
      <div class="subj-head">
        <div class="subj-em">${getEmoji(subject)}</div>
        <div class="subj-nm">${escapeHTML(subject)}</div>
        <div class="subj-metrics">
          <div class="subj-track"><div class="subj-fill ${low ? 'low' : ''}" style="width:${pct}%"></div></div>
          <div class="subj-pct ${low ? 'low' : ''}">${pct}%</div>
        </div>
        <div class="subj-op">⌄</div>
      </div>
      <div class="subj-body">
        <div>
          <div class="subj-rows">${rows}</div>
        </div>
      </div>
    `;

    block.querySelector(".subj-head").addEventListener("click", () => {
      const nowOpen = !expanded.has(subject);
      toggleExpanded(subject);
      block.classList.toggle("open", nowOpen);
    });

    c.appendChild(block);
  });
}

/* ══════════════════════════════════════════════════════════════
   ESCAPE
   ══════════════════════════════════════════════════════════════ */
function escapeHTML(v) {
  return String(v)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

/* ══════════════════════════════════════════════════════════════
   SUBJECT PICKER
   ══════════════════════════════════════════════════════════════ */
function savedSubjects() {
  return [...new Set(classes.map(i => String(i.subject || "").trim()).filter(Boolean))]
    .sort((a, b) => a.localeCompare(b));
}

function renderSuggest(filter = "") {
  const box = document.getElementById("subjectSuggestions");
  if (!box) return;
  const q = filter.trim().toLowerCase();
  const subs = savedSubjects().filter(n => !q || n.toLowerCase().includes(q));

  if (!subs.length) {
    box.innerHTML = `<div class="sug-empty">${q ? "// no matches" : "// no saved subjects"}</div>`;
    return;
  }

  box.innerHTML = subs.map(n => `
    <button type="button" class="sug-item" data-s="${escapeHTML(n)}">
      <span class="em">${getEmoji(n)}</span>
      <span class="nm">${escapeHTML(n)}</span>
      <span class="ed" data-e="${escapeHTML(n)}">✎</span>
    </button>
  `).join("");

  box.querySelectorAll(".sug-item").forEach(b => {
    const pick = e => {
      e.preventDefault();
      document.getElementById("subject").value = b.getAttribute("data-s");
      closeSuggest();
    };
    b.addEventListener("mousedown", pick);
    b.addEventListener("touchstart", pick, { passive: false });
  });

  box.querySelectorAll(".ed").forEach(ed => {
    const open = e => {
      e.preventDefault();
      e.stopPropagation();
      openEmoji(ed.getAttribute("data-e"));
    };
    ed.addEventListener("mousedown", open);
    ed.addEventListener("touchstart", open, { passive: false });
  });
}

function openEmoji(subject) {
  const box = document.getElementById("subjectSuggestions");
  if (!box) return;
  box.innerHTML = `
    <div class="emoji-title">pick emoji · "${escapeHTML(subject)}"</div>
    <div class="emoji-grid">
      ${EMOJI_OPTIONS.map(e => `
        <button type="button" class="emoji-btn${getEmoji(subject) === e ? ' active' : ''}" data-em="${e}">${e}</button>
      `).join("")}
    </div>
  `;
  box.querySelectorAll(".emoji-btn").forEach(b => {
    b.addEventListener("click", e => {
      e.preventDefault();
      setEmoji(subject, b.getAttribute("data-em"));
      renderSubjects();
      renderSuggest(document.getElementById("subject").value);
    });
  });
  box.classList.add("show");
}

function openSuggest() {
  const box = document.getElementById("subjectSuggestions");
  if (!box) return;
  renderSuggest(document.getElementById("subject").value);
  box.classList.add("show");
}
function closeSuggest() {
  const box = document.getElementById("subjectSuggestions");
  if (box) box.classList.remove("show");
}

function initPicker() {
  const input = document.getElementById("subject");
  const arrow = document.getElementById("subjectPickerArrow");
  if (!input || !arrow) return;

  input.addEventListener("focus", openSuggest);
  input.addEventListener("input", openSuggest);

  arrow.addEventListener("mousedown", e => {
    e.preventDefault();
    const box = document.getElementById("subjectSuggestions");
    if (box.classList.contains("show")) closeSuggest();
    else { input.focus(); openSuggest(); }
  });

  document.addEventListener("mousedown", e => {
    const wrap = document.querySelector(".subject-wrap");
    if (wrap && !wrap.contains(e.target)) closeSuggest();
  });
}

/* ══════════════════════════════════════════════════════════════
   MASTER RENDER
   ══════════════════════════════════════════════════════════════ */
function render() {
  renderOverview();
  renderSchedule();
  renderSubjects();
}

/* ══════════════════════════════════════════════════════════════
   WIRE
   ══════════════════════════════════════════════════════════════ */
document.getElementById("addBtn").addEventListener("click", addClass);
document.getElementById("clearBtn").addEventListener("click", clearForm);
document.getElementById("resetBtn").addEventListener("click", resetAll);
document.getElementById("exportBtn").addEventListener("click", exportCSV);

document.addEventListener("keydown", e => {
  const t = (e.target.tagName || "").toLowerCase();
  if (t === "input" || t === "textarea" || t === "select") return;
  if (e.key === "v" || e.key === "V") setMode("view");
  else if (e.key === "e" || e.key === "E") setMode("edit");
  else if (e.key === "Escape") closeSuggest();
});

/* ══════════════════════════════════════════════════════════════
   INIT
   ══════════════════════════════════════════════════════════════ */
initPicker();
initSubjectSection();
setMode(mode, false);
updatePending();
loadData(true).then(() => {
  if (queue.length > 0) flushQueue();
});
</script>
